function readTaskForm(){
  const errors = [], bad = [];
  const title = $('#f-title').value.trim();
  if (!title) { errors.push('Informe um título.'); bad.push('#f-title'); }
  let date = null;
  if (modalCtx.kind === 'pitem') { const ds = [...modalCtx.pdays].sort(); date = ds[0] || null; if (!date) errors.push('Escolha pelo menos um dia.'); }
  else { const raw = $('#f-date').value.trim(); if (raw) { date = parseBR(raw); if (!date) { errors.push('Data inválida. Use o formato dd/mm/aaaa.'); bad.push('#f-date'); } } }
  const start = $('#f-start').value.trim(), end = $('#f-end').value.trim();
  if (start && !isTime(start)) { errors.push('Horário de início inválido. Use hh:mm entre 00:00 e 23:59.'); bad.push('#f-start'); }
  if (end && !isTime(end)) { errors.push('Horário de fim inválido. Use hh:mm entre 00:00 e 23:59.'); bad.push('#f-end'); }
  if (end && !start) { errors.push('Informe o início para usar um horário de fim.'); bad.push('#f-start'); }
  if (isTime(start) && isTime(end) && toMin(end) <= toMin(start)) { errors.push('O horário de fim precisa ser maior que o de início.'); bad.push('#f-end'); }
  if (start && !date && modalCtx.kind === 'task') { errors.push('Para definir horário, escolha uma data.'); bad.push('#f-date'); }
  const category = $('#f-cat').value;
  if (category === '__new') { errors.push('Crie a nova categoria ou escolha uma existente.'); bad.push('#f-cat'); }
  return { errors, bad, data: { title, date, start: isTime(start) ? start : '', end: isTime(end) ? end : '', category, priority: modalCtx.pri, status: modalCtx.status, notes: $('#f-notes').value.trim() } };
}
function showErrors(errors, bad){
  $$('#modal-root .invalid').forEach(e => e.classList.remove('invalid'));
  bad.forEach(s => $(s)?.classList.add('invalid'));
  const box = $('#f-errors'); if (!box) return;
  box.hidden = !errors.length;
  box.innerHTML = errors.length ? `${icon('alert')}<ul>${errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : '';
}
function formConflicts(){
  if (!modalCtx || !['task', 'pitem'].includes(modalCtx.kind)) return [];
  const { data } = readTaskForm();
  if (!data.date || !data.start) return [];
  const probe = { id: modalCtx.id, date: data.date, start: data.start, end: data.end };
  if (modalCtx.kind === 'task') return conflictsOf(probe);
  const own = new Set(modalCtx.scopeAll ? modalCtx.seriesIds : [modalCtx.id]);
  const items = peekPlan(modalCtx.planKey).items.filter(i => !own.has(i.id)).map(i => ({ ...i, status: 'todo' }));
  return modalCtx.pdays.flatMap(d => conflictsOf({ ...probe, date: d }, items).map(o => ({ ...o, title: `${o.title} · ${DOW_S[dowOf(d)]}` })));
}
function updateConflict(){
  const box = $('#f-conflict'); if (!box) return;
  const c = formConflicts();
  box.hidden = !c.length;
  box.innerHTML = c.length ? `${icon('alert')}<span>Conflito de horário com ${c.map(o => `<strong>${esc(o.title)}</strong> (${timeLabel(o)})`).join(', ')}. Você pode salvar mesmo assim.</span>` : '';
}

/* Mantém o item de planejamento ligado à tarefa em sincronia (evita duplicar ao reaplicar). */
function syncPlanFromTask(t){
  for (const k in state.plans) for (const i of state.plans[k].items) if (i.taskId === t.id) {
    if (t.date && weekDays(k).includes(t.date)) Object.assign(i, { title: t.title, date: t.date, start: t.start, end: t.end, category: t.category, priority: t.priority });
    else i.taskId = null; // saiu da semana planejada: desvincula
  }
}
function removePlanLinks(taskId){
  for (const k in state.plans) { const p = state.plans[k]; p.items = p.items.filter(i => i.taskId !== taskId); }
}

function saveTask(){
  const { errors, bad, data } = readTaskForm(); showErrors(errors, bad); if (errors.length) return;
  const conf = formConflicts();
  let t;
  if (modalCtx.id) { t = findTask(modalCtx.id); Object.assign(t, data, { updatedAt: new Date().toISOString() }); }
  else { t = { id: uid(), createdAt: todayKey(), ...data }; state.tasks.push(t); }
  syncPlanFromTask(t);
  closeModal(); commit();
  toast(conf.length ? 'Tarefa salva, com conflito de horário.' : 'Tarefa salva.');
}
function savePitem(){
  const { errors, bad, data } = readTaskForm(); showErrors(errors, bad); if (errors.length) return;
  const plan = getPlan(modalCtx.planKey);
  const f = { title: data.title, start: data.start, end: data.end, category: data.category, priority: data.priority, notes: data.notes };
  const days = [...modalCtx.pdays].sort();
  const syncTask = it => { const t = it.taskId && findTask(it.taskId); if (t) Object.assign(t, { title: it.title, date: it.date, start: it.start, end: it.end, category: it.category, priority: it.priority }); };
  let removed = 0;
  if (modalCtx.id && modalCtx.scopeAll) {
    // editar a série inteira: atualiza os dias mantidos, cria os novos e remove os desmarcados
    const sib = plan.items.filter(x => modalCtx.seriesIds.includes(x.id));
    const sid = sib.find(x => x.series)?.series || uid();
    for (const d of days) {
      let it = sib.find(x => x.date === d);
      if (it) Object.assign(it, f, { series: sid });
      else { it = { id: uid(), taskId: null, series: sid, ...f, date: d }; plan.items.push(it); }
      syncTask(it);
    }
    for (const x of sib.filter(x => !days.includes(x.date))) {
      plan.items = plan.items.filter(y => y !== x); removed++;
      const t = x.taskId && findTask(x.taskId); if (t && t.status !== 'done') state.tasks = state.tasks.filter(y => y !== t);
    }
  } else if (modalCtx.id) {
    const it = plan.items.find(i => i.id === modalCtx.id);
    const keep = days.includes(it.date) ? it.date : days[0];
    Object.assign(it, f, { date: keep }); syncTask(it);
    days.filter(d => d !== keep).forEach(d => plan.items.push({ id: uid(), taskId: null, series: it.series, ...f, date: d }));
  } else {
    const sid = days.length > 1 ? uid() : undefined;
    days.forEach(d => plan.items.push({ id: uid(), taskId: null, series: sid, ...f, date: d }));
  }
  touchPlan(plan); closeModal(); commit();
  const lbl = days.map(d => DOW_S[dowOf(d)]).join(', ');
  toast((days.length > 1 ? `Atividade salva em ${days.length} dias: ${lbl}.` : 'Atividade salva.') + (removed ? ` ${removed} ${removed === 1 ? 'dia removido' : 'dias removidos'}.` : ''));
}

/* ---------- Lógica do planejamento ---------- */
function planDateFor(key, srcDate){ const off = (dowOf(srcDate) - state.settings.weekStart + 7) % 7; return addKey(key, off); }
function addItemFromTask(key, t, date){
  const plan = getPlan(key);
  if (plan.items.some(i => i.taskId === t.id)) return null;
  const item = { id: uid(), taskId: t.id, title: t.title, date, start: t.start || '', end: t.end || '', category: t.category, priority: t.priority, notes: t.notes || '' };
  plan.items.push(item); touchPlan(plan); return item;
}
function applyPlan(key){
  const plan = getPlan(key); let created = 0, updated = 0, removed = 0;
  for (const i of plan.items) {
    const f = { title: i.title, date: i.date, start: i.start, end: i.end, category: i.category, priority: i.priority };
    const t = i.taskId && findTask(i.taskId);
    if (t) { Object.assign(t, f); if (i.notes && !t.notes) t.notes = i.notes; updated++; }
    else { const nt = { id: uid(), createdAt: todayKey(), status: 'todo', notes: i.notes || '', planKey: key, ...f }; state.tasks.push(nt); i.taskId = nt.id; created++; }
  }
  const keep = new Set(plan.items.map(i => i.taskId));
  state.tasks = state.tasks.filter(t => { const drop = t.planKey === key && !keep.has(t.id) && t.status !== 'done'; if (drop) removed++; return !drop; });
  plan.appliedAt = new Date().toISOString(); plan.updatedAt = plan.appliedAt;
  return { created, updated, removed };
}

/* Entrada rápida: "14:00 Ligar para cliente" ou "14h Ligar" → horário + título */
function parseQuick(txt){
  const m = /^\s*(\d{1,2})(?:[:h](\d{2})?)\s+(.+)$/i.exec(txt);
  if (m && +m[1] < 24 && (!m[2] || +m[2] < 60)) return { start: `${pad(+m[1])}:${m[2] || '00'}`, title: m[3].trim() };
  return { start: '', title: txt.trim() };
}
function quickAdd(inputSel, date){
  const el = $(inputSel); const q = parseQuick(el.value);
  if (!q.title) { el.classList.add('invalid'); el.focus(); toast('Escreva o título da tarefa.'); return; }
  const t = { id: uid(), createdAt: todayKey(), title: q.title.slice(0, 140), date, start: q.start, end: q.start ? fromMin(Math.min(toMin(q.start) + 60, 1439)) : '', category: date ? 'trabalho' : 'outros', priority: 'media', status: 'todo', notes: '' };
  state.tasks.push(t); commit();
  const again = $(inputSel); again && again.focus();
  const conf = conflictsOf(t).length;
  toast(date ? `Adicionada${q.start ? ' às ' + q.start : ''}${conf ? ' · conflito de horário' : ''}.` : 'Adicionada à caixa de entrada.');
}

function importText(txt){
  let obj;
  try { obj = JSON.parse(txt); } catch (e) { toast('Arquivo inválido: não é um JSON.'); return; }
  const data = obj && obj.dados ? obj.dados : obj;
  if (!data || typeof data !== 'object' || (!Array.isArray(data.habits) && !Array.isArray(data.tasks))) { toast('Este arquivo não parece um backup do Controle de Atividades.'); return; }
  const nh = (data.habits || []).length, nt = (data.tasks || []).length;
  confirmBox({ title: 'Importar backup', text: `O backup tem ${nh} hábitos e ${nt} tarefas. Ele vai substituir todos os dados atuais deste navegador.`, ok: 'Substituir dados', danger: false,
    onOk: () => { state = normalize(data); state.meta.seeded = true; state.meta.fitSeeded = true; resetUiWeeks(); applyTheme(); commit(); toast('Backup importado.'); } });
}
function resetUiWeeks(){

function slotMinutes(col, clientY, step = 15){
  const r = col.getBoundingClientRect();
  const m = DAY_START + Math.floor(((clientY - r.top) / HOUR_PX * 60) / step) * step;
  return clamp(m, DAY_START, DAY_END - step);
}

/* Converte itens antigos ("Musculação · Treino A") em exercícios individuais. */
function migrateItems(list, templates, onTime){
  const out = [];

    if (!raw) continue;
    if (raw.type === 'musculacao') {
      const t = templates.find(x => x.id === raw.templateId);
      if (isTime(raw.start)) onTime({ start: raw.start, end: isTime(raw.end) ? raw.end : '' });
      if (t) { t.items.forEach(i => out.push({ id: uid(), type: 'exercicio', exId: i.exId, label: '', start: '', end: '', taskId: null })); continue; }
      out.push({ id: uid(), type: 'outra', exId: '', label: 'Musculação', start: '', end: '', taskId: null }); continue;
    }
    const type = FIT_TYPES[raw.type] ? raw.type : 'outra';
    out.push({ id: raw.id || uid(), type, exId: raw.exId || '', label: String(raw.label || ''), start: isTime(raw.start) ? raw.start : '', end: isTime(raw.end) ? raw.end : '', taskId: raw.taskId || null });

  const rt = raw.routineTimes && typeof raw.routineTimes === 'object' ? { ...raw.routineTimes } : {};
  for (let d = 0; d < 7; d++) {

    if (rt[d] && isTime(rt[d].start)) f.routineTimes[d] = { start: rt[d].start, end: isTime(rt[d].end) ? rt[d].end : '' };
  }
  if (raw.weekPlans && typeof raw.weekPlans === 'object') for (const k in raw.weekPlans) {

    const src = raw.weekPlans[k] || {}, days = {}, times = { ...(src.times || {}) };
    for (const dk in src.days || {}) if (isYmd(dk) && Array.isArray(src.days[dk])) days[dk] = migrateItems(src.days[dk], f.templates, t => { if (!times[dk]) times[dk] = t; });

  if (!raw.checks) for (const s of f.sessions) for (const k of sessionKeys(s)) { addCheck(f, s.date, k); if (s.example) (f.checksEx[s.date] = f.checksEx[s.date] || []).push(k); }

}

/* ---------- Dados de exemplo ---------- */

/* ---------- Cálculos ---------- */
const exById = id => state.fit.exercises.find(x => x.id === id);
const sessionById = id => state.fit.sessions.find(x => x.id === id);
const actKey = (type, label) => `act:${type}:${norm(label || FIT_TYPES[type]?.label || '')}`;

  if (s.type === 'cardio') return [actKey('cardio', s.cardio?.equip || s.label)];

}
function addCheck(F, date, key){ const a = F.checks[date] || (F.checks[date] = []); if (!a.includes(key)) a.push(key); }
const isChecked = (date, key) => (state.fit.checks[date] || []).includes(key);

function groupsLabel(items){ return joinE([...new Set(items.filter(i => i.type === 'exercicio').map(i => exById(i.exId)?.group).filter(Boolean))]); }

}

  if (s.type === 'musculacao') {

    return `${n} ${n === 1 ? 'exercício' : 'exercícios'} · ${sets} séries${v ? ' · ' + fmtNum(Math.round(v), 0) + ' kg movimentados' : ''}`;

const sessionsOn = k => state.fit.sessions.filter(s => s.date === k).sort((a, b) => (a.start || '99').localeCompare(b.start || '99'));
/* Plano do dia como foi montado (rotina ou ajuste da semana), sem adiamentos. */

/* Primeiro dia com uso real da atividade física (antes disso a rotina não conta como planejada). */

  for (const x of state.fit.sessions) if (x.date < k) k = x.date;

}
function recordOn(date, exId){
  for (const s of state.fit.sessions) if (s.date === date && s.type === 'musculacao') { const x = (s.strength || []).find(y => y.exId === exId); if (x) return { session: s, sets: x.sets }; }

}
const setsText = sets => {

  if (sets.every(s => s.weight === sets[0].weight)) return `${sets.length} séries · ${sets.map(s => s.reps).join('/')} reps · ${w(sets[0].weight)}`;

};
function exSeries(exId){
  return state.fit.sessions.filter(s => (s.strength || []).some(x => x.exId === exId)).sort((a, b) => a.date.localeCompare(b.date)).map(s => {
    const sets = s.strength.find(x => x.exId === exId).sets;
    return { date: s.date, sets, maxW: Math.max(...sets.map(x => x.weight || 0)), maxReps: Math.max(...sets.map(x => x.reps || 0)), volume: sets.reduce((a, x) => a + (x.reps || 0) * (x.weight || 0), 0) };
  });
}
function exercisesWithData(){

function seriesChart(pts, { fmt = v => fmtNum(v), color = 'var(--teal)', aria = '' } = {}){
  if (!pts.length) return `<p class="empty">Ainda não há registros suficientes para o gráfico.</p>`;
  const n = pts.length, vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .18 || Math.max(1, hi * .1);
  lo = Math.max(0, lo - pad); hi = hi + pad;
  if (hi >= 10) { lo = Math.floor(lo); hi = Math.ceil(hi); } else { lo = Math.floor(lo * 10) / 10; hi = Math.ceil(hi * 10) / 10; }
  const y = v => 10 + (1 - (v - lo) / (hi - lo)) * 80, x = i => (i + .5) / n * 100;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(2)} ${y(p.v).toFixed(2)}`).join(' ');
  const area = n > 1 ? `${line} L${x(n - 1).toFixed(2)} 100 L${x(0).toFixed(2)} 100 Z` : '';
  const best = Math.max(...vals);
  const showVal = i => n <= 8 || i === 0 || i === n - 1 || (pts[i].v === best && vals.indexOf(best) === i);
  const showX = i => n <= 9 || (n - 1 - i) % 2 === 0;
  return `<div class="series" role="img" aria-label="${esc(aria)}" style="--sc:${color}">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <line class="gridl" x1="0" x2="100" y1="10" y2="10"/><line class="gridl" x1="0" x2="100" y1="50" y2="50"/><line class="gridl" x1="0" x2="100" y1="90" y2="90"/>
        ${area ? `<path class="area" d="${area}"/>` : ''}<path class="line" d="${line}"/>
      </svg>
      <span class="waxis num" style="top:10%">${fmt(hi)}</span><span class="waxis num" style="top:90%">${fmt(lo)}</span>
      ${pts.map((p, i) => `<span class="wdot ${i === n - 1 ? 'cur' : ''}" style="left:${x(i)}%;top:${y(p.v)}%" title="${fmtBR(p.date)}: ${fmt(p.v)}"></span>${showVal(i) ? `<span class="wval num" style="left:${x(i)}%;top:${y(p.v)}%">${fmt(p.v)}</span>` : ''}`).join('')}
    </div>
    <div class="slabels num" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${pts.map((p, i) => `<span>${showX(i) ? fmtDM(p.date) : ''}</span>`).join('')}</div>`;
}
function weeklyMinutesChart(){
  const cur = weekKeyOf(todayKey()), weeks = [];
  for (let i = 7; i >= 0; i--) {
    const k = addKey(cur, -7 * i), end = addKey(k, 6), by = {}, list = state.fit.sessions.filter(s => s.date >= k && s.date <= end);

function fitProgressView(){
  const exs = exercisesWithData();
  if (!ui.fitEx || !exs.some(e => e.id === ui.fitEx)) ui.fitEx = exs[0]?.id || '';
  const ser = ui.fitEx ? exSeries(ui.fitEx).slice(-14) : [];
  const allBw = ser.length && ser.every(p => !p.maxW);
  const metric = allBw && ui.fitMetric !== 'reps' ? 'reps' : ui.fitMetric;
  const pts = ser.map(p => ({ date: p.date, v: metric === 'volume' ? p.volume : metric === 'reps' ? p.maxReps : p.maxW }));
  const unit = metric === 'reps' ? ' reps' : ' kg';
  const fmtV = v => fmtNum(metric === 'volume' ? Math.round(v) : v, metric === 'volume' ? 0 : 1) + unit;
  const first = pts[0], last = pts[pts.length - 1], best = pts.length ? pts.reduce((a, p) => p.v >= a.v ? p : a) : null;
  const diff = first && last ? last.v - first.v : 0;
  const cut = addKey(todayKey(), -28);
  const recs = exs.map(e => {
    const s = exSeries(e.id), bestW = Math.max(...s.map(p => p.maxW)), bestP = s.find(p => p.maxW === bestW);
    const lastP = s[s.length - 1], before = s.filter(p => p.date <= cut).pop();
    return { e, bestW, bestDate: bestP.date, delta: before ? lastP.maxW - before.maxW : null };
  }).filter(r => r.bestW > 0);
  const eqs = [...new Set(state.fit.sessions.filter(s => s.type === 'cardio' && s.cardio).map(s => s.cardio.equip))];
  if (!eqs.includes(ui.fitEquip)) ui.fitEquip = eqs[0] || 'Esteira';
  const cm = ui.fitCardioMetric;

function usedExercises(){

  }

    <span class="hint">Carga vazia = peso do corpo.</span></div>`;

function readSets(rows, label, errors){
  const out = [];
  rows.forEach((st, j) => {
    if (st.reps === '' && st.weight === '') return;
    const r = parseNum(st.reps), w = st.weight === '' ? 0 : parseNum(st.weight);
    if (!Number.isInteger(r) || r < 1 || r > 300) errors.push(`${label}: repetições da série ${j + 1} inválidas.`);
    else if (!Number.isFinite(w) || w < 0 || w > 1000) errors.push(`${label}: carga da série ${j + 1} inválida.`);
    else out.push({ reps: r, weight: Math.round(w * 100) / 100 });
  });
  return out;
}
function daySession(date){
  let s = state.fit.sessions.find(x => x.date === date && x.type === 'musculacao');
  if (!s) {
    const t = timesFor(date);
    s = { id: uid(), date, type: 'musculacao', start: t.start || '', duration: t.start && t.end ? toMin(t.end) - toMin(t.start) : null, intensity: 'moderada', notes: '', templateId: '', label: '', strength: [], cardio: null };
    state.fit.sessions.push(s);
  }
  return s;
}
function saveExLog(){
  const { date, exId } = modalCtx, errors = [];
  const sets = readSets(modalCtx.draft.sets, exById(exId)?.name || 'Exercício', errors);
  if (!sets.length && !errors.length) errors.push('Preencha pelo menos uma série.');
  showErrors(errors, []); if (errors.length) return;
  const s = daySession(date), x = s.strength.find(y => y.exId === exId);
  if (x) x.sets = sets; else s.strength.push({ exId, sets });
  delete s.example;
  addCheck(state.fit, date, 'ex:' + exId);
  ui.justToggled = 'ex:' + exId + '|' + date;
  closeModal(); commit(); toast('Séries registradas e item marcado.');
}

function saveWorkout(){
  const d = modalCtx.draft, errors = [], bad = [];
  const date = parseBR(d.dateTxt ?? fmtBR(d.date));
  if (!date) { errors.push('Data inválida. Use dd/mm/aaaa.'); bad.push('#wk-date'); }
  if (d.start && !isTime(d.start)) { errors.push('Horário de início inválido (hh:mm).'); bad.push('#wk-start'); }
  const dur = parseNum(d.duration);
  if (d.duration !== '' && (!Number.isInteger(dur) || dur <= 0 || dur > 600)) { errors.push('Duração deve ser um número de minutos entre 1 e 600.'); bad.push('#wk-dur'); }
  const s = { id: d.id || uid(), date, type: d.type, start: isTime(d.start) ? d.start : '', duration: dur || null, intensity: d.intensity, notes: d.notes.trim(), templateId: '', label: '', strength: [], cardio: null };

    const blocks = d.strength.filter(x => x.exId || x.sets.some(st => st.reps || st.weight));
    if (!blocks.length) errors.push('Adicione pelo menos um exercício.');
    blocks.forEach((x, i) => {
      if (!x.exId || x.exId === '__new') { errors.push(`Escolha o exercício ${i + 1}.`); return; }
      const nm = exById(x.exId)?.name || 'Exercício', sets = readSets(x.sets, nm, errors);

    if (!dur) { errors.push('Informe a duração do cardio em minutos.'); bad.push('#wk-dur'); }
    const sp = parseNum(d.cardio.speed), inc = parseNum(d.cardio.incline); let dist = parseNum(d.cardio.distance);
    if (sp != null && !(sp >= 0 && sp <= 40)) { errors.push('Velocidade inválida (0 a 40 km/h).'); bad.push('#wk-speed'); }
    if (inc != null && !(inc >= 0 && inc <= 40)) { errors.push('Inclinação inválida (0 a 40%).'); bad.push('#wk-incline'); }
    if (dist != null && !(dist >= 0 && dist <= 300)) { errors.push('Distância inválida.'); bad.push('#wk-distance'); }
    if (dist == null && sp > 0 && dur > 0) dist = Math.round(sp * dur / 60 * 100) / 100;
    s.label = d.cardio.equip; s.cardio = { equip: d.cardio.equip, speed: sp, incline: inc, distance: dist };
  } else {

    if (!dur) { errors.push('Informe a duração em minutos.'); bad.push('#wk-dur'); }
    s.label = d.label.trim();
  }
  showErrors(errors, bad); if (errors.length) return;
  const i = state.fit.sessions.findIndex(x => x.id === s.id);
  if (i >= 0) state.fit.sessions[i] = s; else state.fit.sessions.push(s);
  for (const k of sessionKeys(s)) addCheck(state.fit, date, k); // registrar também marca no checklist

  closeModal(); commit(); toast(d.id ? 'Registro atualizado.' : 'Registro salvo e marcado no checklist.');
}

/* Coloca os horários de treino na Agenda (sem duplicar) */
function applyFitWeek(key){
  const wp = materializeWeek(key), keep = new Set(); let created = 0, updated = 0, removed = 0;
  const upsert = (holder, f) => {
    const t = holder.taskId && findTask(holder.taskId);
    if (t) { Object.assign(t, f); updated++; }
    else { const nt = { id: uid(), createdAt: todayKey(), status: 'todo', notes: 'Atividade física planejada.', fitPlanKey: key, ...f }; state.tasks.push(nt); holder.taskId = nt.id; created++; }
    keep.add(holder.taskId);
  };
  for (const date of weekDays(key)) {
    const items = wp.days[date], tm = wp.times[date] || (wp.times[date] = {});
    if (items.some(e => e.type === 'exercicio') && isTime(tm.start)) {
      const g = groupsLabel(items);
      upsert(tm, { title: 'Academia' + (g ? ' · ' + g : ''), date, start: tm.start, end: isTime(tm.end) ? tm.end : fromMin(Math.min(toMin(tm.start) + 60, 1439)), category: 'saude', priority: 'media' });
    }
    for (const e of items) if (e.type !== 'exercicio' && e.type !== 'descanso' && isTime(e.start))
      upsert(e, { title: itemName(e), date, start: e.start, end: isTime(e.end) ? e.end : fromMin(Math.min(toMin(e.start) + 60, 1439)), category: 'saude', priority: 'media' });
  }
  state.tasks = state.tasks.filter(t => { const drop = t.fitPlanKey === key && !keep.has(t.id) && t.status !== 'done'; if (drop) removed++; return !drop; });
  return { created, updated, removed };
}

/* =========================================================================
   8. Rastro: adiar, cancelar e atrasos (tarefas, hábitos e atividade física)
   Tarefa: plan (data planejada original), hist [{k, from, to, r, n, at}], ld (última data vista), dk (dia em que foi concluída)
     k = adiada (você mudou antes de o dia acabar) | atraso (mudou depois que já estava atrasada)
         replanejada (mudou antes do dia chegar) | agendada (saiu da caixa de entrada) | cancelada | reaberta
   Hábitos e treino: state.moves.{habits|fit}[dia][id] = {to, r, n, at} (adiado) ou {c: 1, r, n, at} (cancelado)
   ========================================================================= */
const POSTPONE_REASONS = [['imprevisto', 'Imprevisto'], ['tempo', 'Falta de tempo'], ['errado', 'Planejei errado'], ['prioridade', 'Mudou a prioridade'], ['terceiros', 'Depende de outra pessoa'], ['outro', 'Outro']];
const CANCEL_REASONS = [['esqueci', 'Esqueci'], ['naodeu', 'Não deu tempo'], ['desnecessaria', 'Não é mais necessária'], ['prioridade', 'Mudou a prioridade'], ['terceiros', 'Outra pessoa resolveu'], ['errado', 'Planejei errado'], ['outro', 'Outro']];
const REASON_L = Object.fromEntries([...POSTPONE_REASONS, ...CANCEL_REASONS, ['nd', 'Não informado']]);
const reasonText = (r, n) => r === 'outro' && n ? n : REASON_L[r] || 'Não informado';
const nowISO = () => new Date().toISOString();
const isoDay = iso => { const d = new Date(iso); return isNaN(d) ? null : ymd(d); };
const MOVE_KINDS = ['adiada', 'atraso'];

/* Registra automaticamente toda mudança de data e de conclusão das tarefas (roda a cada gravação). */
function trackTasks(){
  const tk = todayKey();
  for (const t of state.tasks) {
    if (!Array.isArray(t.hist)) t.hist = [];
    if (!('ld' in t)) {          // tarefa nova ou vinda da versão anterior
      t.ld = t.date; if (t.plan === undefined) t.plan = t.date;
      t.dk = t.status === 'done' ? (t.doneAt ? isoDay(t.doneAt) : t.date || tk) : null;
      delete t._r; continue;
    }
    if (t.status === 'done' && !t.dk) t.dk = tk;
    if (t.status !== 'done' && t.dk) t.dk = null;
    if (t.ld === t.date) { delete t._r; continue; }
    const from = t.ld, to = t.date, R = t._r; delete t._r;
    let k;
    if (!from) k = 'agendada';
    else if (t.status === 'done') k = 'replanejada';
    else if (from < tk) k = 'atraso';
    else if (from === tk || R) k = 'adiada';
    else k = 'replanejada';
    const e = { k, from: from || null, to: to || null, at: nowISO() };
    if (MOVE_KINDS.includes(k)) { e.r = R?.r || 'nd'; if (R?.n) e.n = R.n; }
    t.hist.push(e);
    if ((k === 'replanejada' || k === 'agendada') && !t.hist.some(x => MOVE_KINDS.includes(x.k))) t.plan = to;
    if (!t.plan) t.plan = to;
    t.ld = to;
  }
}

const taskMoves = t => (t.hist || []).filter(e => MOVE_KINDS.includes(e.k));
const taskPlan = t => t.plan || t.date || null;
const taskDoneDay = t => t.status === 'done' ? (t.dk || (t.doneAt ? isoDay(t.doneAt) : null) || t.date || taskPlan(t)) : null;
const OUT_L = { no_dia: 'Feita no dia', adiada_feita: 'Adiada e feita', atraso_feita: 'Feita com atraso', atrasada: 'Atrasada', cancelada: 'Cancelada', adiada_aberta: 'Adiada, a fazer', pendente: 'No prazo, a fazer' };
/* Resultado da tarefa em relação ao que foi planejado. */
function taskOutcome(t, tk = todayKey()){
  if (isCanceled(t)) return 'cancelada';
  const mv = taskMoves(t), late = mv.some(e => e.k === 'atraso'), plan = taskPlan(t);
  if (t.status === 'done') {
    const dk = taskDoneDay(t);
    if (!mv.length) return !plan || dk <= plan ? 'no_dia' : 'atraso_feita';
    return late || (t.date && dk > t.date) ? 'atraso_feita' : 'adiada_feita';
  }
  if ((t.date && t.date < tk) || late) return 'atrasada'; // reagendada depois de atrasar continua contando como atraso até ser feita
  return mv.length ? 'adiada_aberta' : 'pendente';
}
/* Cada dia em que a tarefa esteve na agenda, com o que aconteceu nele. */
function taskOccs(t, tk = todayKey()){
  const occ = [];
  for (const e of t.hist || []) if (MOVE_KINDS.includes(e.k) && e.from) occ.push({ d: e.from, o: e.k === 'adiada' ? 'adiada' : 'atrasada', r: e.r, n: e.n });
  if (t.date) {
    let o;
    if (t.status === 'done') o = taskDoneDay(t) <= t.date ? 'feita' : 'atrasada';
    else if (isCanceled(t)) o = 'cancelada';
    else o = t.date < tk ? 'atrasada' : 'pendente';
    occ.push({ d: t.date, o });
  }
  return occ;
}
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
function taskTrail(t){
  const out = [], plan = taskPlan(t);
  const first = (t.hist || []).find(e => MOVE_KINDS.includes(e.k));
  const p0 = first ? first.from : plan;
  if (p0) out.push({ cls: '', txt: `Planejada para ${DOW_S[dowOf(p0)]}, ${fmtBR(p0)}` });
  else out.push({ cls: '', txt: 'Criada sem data (caixa de entrada)' });
  for (const e of t.hist || []) {
    const when = e.at ? fmtBR(isoDay(e.at)) : '';
    const dest = e.to ? `${DOW_S[dowOf(e.to)]}, ${fmtBR(e.to)}` : 'sem data';
    if (e.k === 'adiada') out.push({ cls: 'adi', txt: `Adiada para ${dest} · ${reasonText(e.r, e.n)}`, when });
    else if (e.k === 'atraso') out.push({ cls: 'late', txt: `Estava atrasada desde ${fmtBR(e.from)} · remarcada para ${dest} · ${reasonText(e.r, e.n)}`, when });
    else if (e.k === 'replanejada' && first) out.push({ cls: '', txt: `Data alterada para ${dest}`, when });
    else if (e.k === 'agendada' && first) out.push({ cls: '', txt: `Agendada para ${dest}`, when });
    else if (e.k === 'cancelada') out.push({ cls: 'can', txt: `Cancelada · ${reasonText(e.r, e.n)}`, when });
    else if (e.k === 'reaberta') out.push({ cls: '', txt: 'Reaberta', when });
  }
  if (t.status === 'done') { const dk = taskDoneDay(t); out.push({ cls: 'ok', txt: `Concluída em ${DOW_S[dowOf(dk)]}, ${fmtBR(dk)}` }); }
  return out;
}
function trailHtml(t){
  const steps = taskTrail(t), o = taskOutcome(t);
  return `<div class="trail"><div class="trail-head"><span class="label">Rastro da tarefa</span><span class="obadge o-${o}">${OUT_L[o]}</span></div>
    <ol>${steps.map(s => `<li class="${s.cls}"><span>${esc(s.txt)}</span>${s.when ? `<span class="num muted">${s.when}</span>` : ''}</li>`).join('')}</ol></div>`;
}

/* ---------- Hábitos e treino adiados/cancelados ---------- */
let MVX = null;
function mvIndex(){
  if (MVX && MVX.src === state.moves && MVX.v === saveVer) return MVX;
  const into = { habits: {}, fit: {} };
  for (const g of ['habits', 'fit']) for (const d in state.moves[g]) for (const id in state.moves[g][d]) {
    const m = state.moves[g][d][id]; if (!m.c && m.to) (into[g][m.to] || (into[g][m.to] = [])).push({ id, from: d, m });
  }
  return (MVX = { src: state.moves, v: saveVer, into });
}
const hMove = (k, hid) => state.moves.habits[k]?.[hid];
const habitFrom = (hid, k) => (mvIndex().into.habits[k] || []).find(x => x.id === hid)?.from || null;
function habitOn(h, k){
  if (hMove(k, h.id)) return false;
  if (habitApplies(h, k)) return true;
  return !!habitFrom(h.id, k);
}
const fMove = (k, key) => state.moves.fit[k]?.[key];
/* Plano efetivo do dia: tira o que foi adiado/cancelado e inclui o que veio de outros dias. */
function plannedFor(k){
  const base = plannedRaw(k).filter(e => { const key = itemKey(e); return !key || !fMove(k, key); });
  const keys = new Set(base.map(itemKey));
  for (const x of mvIndex().into.fit[k] || []) {
    if (keys.has(x.id) || fMove(k, x.id)) continue;
    keys.add(x.id);
    const it = x.m.item || {};
    base.push({ id: 'mv' + x.from + x.id, type: it.type || 'outra', exId: it.exId || '', label: it.label || '', start: '', end: '', taskId: null, from: x.from });
  }
  return base;
}
/* Itens de treino de dias anteriores que ficaram sem marcar (a partir da atualização, até 7 dias). */
function fitLateDays(tk = todayKey()){
  const out = [];
  for (let d = lateStart(tk); d < tk; d = addKey(d, 1)) {
    const items = plannedFor(d).filter(e => e.type !== 'descanso' && !isChecked(d, itemKey(e)));
    if (items.length) out.push({ d, items });
  }
  return out;
}
const lateTasks = (tk = todayKey()) => sortTasks(state.tasks.filter(t => t.date && t.date < tk && t.status !== 'done' && !isCanceled(t)));

/* ---------- Modal: adiar ou cancelar ---------- */
function shiftItems(tg){
  if (tg.type === 'task') { const t = findTask(tg.id); return t ? [t.title] : []; }
  if (tg.type === 'tasks') return tg.ids.map(id => findTask(id)?.title).filter(Boolean);
  if (tg.type === 'habit') { const h = findHabit(tg.id); return h ? [h.name] : []; }
  if (tg.type === 'habitday') return tg.ids.map(id => findHabit(id)?.name).filter(Boolean);
  const items = plannedFor(tg.date).filter(e => (tg.keys || [tg.key]).includes(itemKey(e)));
  return items.map(itemName);
}
function shiftOcc(tg){
  const tk = todayKey();
  if (tg.type === 'task') return findTask(tg.id)?.date || tk;
  if (tg.type === 'tasks') return tg.ids.map(id => findTask(id)?.date).filter(Boolean).sort()[0] || tk;
  return tg.date;
}
function openShift(tg, mode = 'adiar'){
  const tk = todayKey(), occ = shiftOcc(tg), min = occ < tk ? tk : addKey(occ, 1);
  modalCtx = { kind: 'shift', tg, mode, r: null, note: '', min, to: min, occ };
  openModal({ title: 'Adiar ou cancelar', body: `<div id="sh-body">${shiftBody()}</div><div id="f-errors" class="notice error" hidden role="alert"></div>`,
    footer: `<span class="spacer"></span><button class="btn" data-act="modal-close">Voltar</button><button class="btn btn-primary" data-act="modal-save" id="sh-ok">${mode === 'adiar' ? 'Adiar' : 'Cancelar item'}</button>` });
}
function shiftBody(){
  const c = modalCtx, tk = todayKey(), names = shiftItems(c.tg);
  const what = c.tg.type === 'habit' ? 'Hábito' : c.tg.type === 'habitday' ? 'Hábitos' : c.tg.type === 'fit' || c.tg.type === 'fitday' ? 'Atividade física' : names.length > 1 ? 'Tarefas' : 'Tarefa';
  const nextMon = (() => { let d = addKey(tk, 1); while (dowOf(d) !== 1) d = addKey(d, 1); return d; })();
  const chips = [[tk, 'Hoje'], [addKey(tk, 1), 'Amanhã'], [addKey(tk, 2), cap(DOW_L[dowOf(addKey(tk, 2))]).split('-')[0]], [nextMon, 'Próxima segunda']]
    .filter(([k], i, a) => k >= c.min && a.findIndex(x => x[0] === k) === i);
  const reasons = c.mode === 'adiar' ? POSTPONE_REASONS : CANCEL_REASONS;
  return `<div class="sh-what"><span class="eyebrow">${what} · ${c.occ < tk ? 'planejado para' : 'de'} ${DOW_S[dowOf(c.occ)]}, ${fmtBR(c.occ)}</span>
      <strong>${esc(names.slice(0, 4).join(' · '))}${names.length > 4 ? ` e mais ${names.length - 4}` : ''}</strong></div>
    <div class="seg sh-mode" role="group" aria-label="O que fazer"><button data-act="sh-mode" data-v="adiar" aria-pressed="${c.mode === 'adiar'}">${icon('arrow-right', 'ic-sm')}Adiar</button><button data-act="sh-mode" data-v="cancelar" aria-pressed="${c.mode === 'cancelar'}">${icon('ban', 'ic-sm')}Cancelar</button></div>
    ${c.mode === 'adiar' ? `<div class="field"><label class="label" for="sh-date">Adiar para quando?</label>
      <div class="date-row">${chips.map(([k, l]) => `<button class="chip" data-act="sh-day" data-k="${k}" aria-pressed="${c.to === k}">${l}</button>`).join('')}</div>
      <input id="sh-date" class="input num" data-mask="date" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" value="${fmtBR(c.to)}" data-min="${c.min}" data-input="sh-date" style="margin-top:8px;max-width:180px">
      <span class="hint">Toque no campo para abrir o calendário.</span></div>` : ''}
    <div class="field"><span class="label">Motivo</span>
      <div class="reason-grid">${reasons.map(([v, l]) => `<button class="chip" data-act="sh-r" data-v="${v}" aria-pressed="${c.r === v}">${l}</button>`).join('')}</div>
      <input id="sh-note" class="input" maxlength="120" placeholder="${c.r === 'outro' ? 'Descreva o motivo' : 'Detalhe (opcional)'}" value="${esc(c.note)}" data-input="sh-note" style="margin-top:8px"></div>
    <p class="hint sh-explain">${c.mode === 'adiar'
      ? 'Fica registrado quando foi planejado e para quando foi adiado. No Painel, ele conta como adiado, não como falha.'
      : 'Sai da lista e conta como cancelado no Painel, com o motivo. O histórico é mantido.'}</p>`;
}
function shiftRedraw(){ $('#sh-body').innerHTML = shiftBody(); const b = $('#sh-ok'); if (b) b.textContent = modalCtx.mode === 'adiar' ? 'Adiar' : 'Cancelar item'; }
function saveShift(){
  const c = modalCtx, errors = [], bad = [], note = ($('#sh-note')?.value || '').trim();
  let to = null;
  if (c.mode === 'adiar') {
    to = parseBR($('#sh-date').value);
    if (!to) { errors.push('Escolha a nova data.'); bad.push('#sh-date'); }
    else if (to < c.min) { errors.push(`Escolha uma data a partir de ${fmtBR(c.min)}.`); bad.push('#sh-date'); }
  }
  if (!c.r) errors.push('Escolha o motivo.');
  if (c.r === 'outro' && !note) { errors.push('Descreva o motivo.'); bad.push('#sh-note'); }
  showErrors(errors, bad); if (errors.length) return;
  const undo = snapshotUndo(), at = nowISO(), R = { r: c.r }; if (note) R.n = note;
  const tg = c.tg; let n = 0;
  const doTask = t => {
    if (!t || t.status === 'done' || isCanceled(t)) return;
    if (c.mode === 'adiar') { t._r = R; t.date = to; syncPlanFromTask(t); }
    else { t.status = 'canceled'; t.cancel = { ...R, at }; (t.hist || (t.hist = [])).push({ k: 'cancelada', ...R, at }); }
    n++;
  };
  const put = (g, d, id, extra = {}) => { const box = state.moves[g][d] || (state.moves[g][d] = {}); box[id] = c.mode === 'adiar' ? { to, ...R, at, ...extra } : { c: 1, ...R, at, ...extra }; n++; };
  if (tg.type === 'task') doTask(findTask(tg.id));
  else if (tg.type === 'tasks') tg.ids.forEach(id => doTask(findTask(id)));
  else if (tg.type === 'habit') put('habits', tg.date, tg.id);
  else if (tg.type === 'habitday') tg.ids.forEach(id => put('habits', tg.date, id));
  else {
    const items = plannedFor(tg.date);
    for (const key of tg.keys || [tg.key]) { const e = items.find(x => itemKey(x) === key); if (e) put('fit', tg.date, key, { item: { type: e.type, exId: e.exId || '', label: e.label || '' } }); }
  }
  closeModal(); commit();
  const what = n > 1 ? `${n} itens` : 'Item';
  toast(c.mode === 'adiar' ? `${what} adiado${n > 1 ? 's' : ''} para ${dayShort(to).toLowerCase()}.` : `${what} cancelado${n > 1 ? 's' : ''}.`, { undo });
}

/* ---------- Feito com atraso (hábitos e treino marcados depois do dia) ---------- */
const lateOn = (g, d, id) => state.late[g][d]?.[id] || null;
function markLate(g, d, id, on){
  const tk = todayKey();
  if (on && d < tk) (state.late[g][d] || (state.late[g][d] = {}))[id] = tk;
  else if (state.late[g][d]) { delete state.late[g][d][id]; if (!Object.keys(state.late[g][d]).length) delete state.late[g][d]; }
}
const LATE_DAYS = 7; // hábitos e treino ficam pendentes por até 7 dias; depois contam como não feitos
const lateStart = tk => { const lim = addKey(tk, -LATE_DAYS), st = state.meta.trackStart || tk; return st > lim ? st : lim; };
function habitLateDays(tk = todayKey()){
  const out = [];
  for (let d = lateStart(tk); d < tk; d = addKey(d, 1)) { const hs = habitsFor(d).filter(h => !isDone(h.id, d)); if (hs.length) out.push({ d, items: hs }); }
  return out;
}

/* ---------- Tela Hoje: tarefas e atividades atrasadas ---------- */
function lateSection(){
  const tk = todayKey(), tasks = lateTasks(tk), fits = fitLateDays(tk), habs = habitLateDays(tk);
  if (!tasks.length && !fits.length && !habs.length) return '';
  const n = tasks.length + fits.reduce((a, x) => a + x.items.length, 0) + habs.reduce((a, x) => a + x.items.length, 0);
  const ago = d => { const x = daysBetween(d, tk); return `<span class="badge late num">${x} ${x === 1 ? 'dia' : 'dias'} de atraso</span>`; };
  const acts = (attrs, label) => `<div class="lacts"><button class="btn btn-sm" data-act="shift" ${attrs}>${icon('arrow-right', 'ic-sm')}Adiar${label ? ' ' + label : ''}</button><button class="icon-btn sm" data-act="shift" ${attrs} data-mode="cancelar" title="Cancelar" aria-label="Cancelar">${icon('ban')}</button></div>`;
  const rowT = t => {
    const mv = taskMoves(t).length, c = catById(t.category);
    return `<div class="lrow">
      <button class="tcheck" data-act="toggle-task" data-id="${t.id}" aria-label="Marcar como concluída">${CHECK_SVG}</button>
      <div class="lmain" data-act="task-edit" data-id="${t.id}" role="button" tabindex="0">
        <div class="ttitle">${esc(t.title)}</div>

/* =========================================================================
   9. Painel — gestão: compara áreas e períodos
   Hábitos: feitos ÷ previstos. Atividade física: itens feitos ÷ planejados.
   Tarefas: concluídas ÷ planejadas que já venceram (sem canceladas e sem as que ainda estão no prazo),

const AREAS = [['h', 'Hábitos', 'var(--teal)'], ['t', 'Tarefas', 'var(--terra)'], ['f', 'Atividade física', 'var(--sand)']];
const MODES = [['semana', 'Semana'], ['mes', 'Mês'], ['tri', 'Trimestre'], ['ano', 'Ano']];

function periodOf(mode, ref){
  const d = parseYmd(ref);
  if (mode === 'semana') { const s = weekKeyOf(ref); return { s, e: addKey(s, 6), label: 'Semana de ' + weekRangeLabel(s), short: fmtDM(s) }; }
  if (mode === 'mes') { const s = ymd(new Date(d.getFullYear(), d.getMonth(), 1)), e = ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)); return { s, e, label: `${cap(MON_L[d.getMonth()])} de ${d.getFullYear()}`, short: cap(MON_L[d.getMonth()]).slice(0, 3) }; }
  if (mode === 'tri') { const q = Math.floor(d.getMonth() / 3), s = ymd(new Date(d.getFullYear(), q * 3, 1)), e = ymd(new Date(d.getFullYear(), q * 3 + 3, 0)); return { s, e, label: `${q + 1}º trimestre de ${d.getFullYear()}`, short: `${q + 1}º tri` }; }
  return { s: `${d.getFullYear()}-01-01`, e: `${d.getFullYear()}-12-31`, label: String(d.getFullYear()), short: String(d.getFullYear()) };

function shiftRef(mode, ref, n){

/* Estatísticas de tarefas por data planejada original. */
function taskStatsRange(s, e, tk = todayKey()){
  const cnt = Object.fromEntries(Object.keys(OUT_L).map(k => [k, 0])), list = [];
  const upto = e < tk ? e : tk;
  for (const t of state.tasks) { const p = taskPlan(t); if (!p || p < s || p > upto) continue; const o = taskOutcome(t, tk); cnt[o]++; list.push({ t, o }); }
  const done = cnt.no_dia + cnt.adiada_feita + cnt.atraso_feita, base = done + cnt.atrasada;
  return { cnt, list, total: list.length, done, base, pct: pct(done, base), prazo: pct(cnt.no_dia, base) };
}

    p++; const ok = isDone(h.id, k); if (ok) { d++; if (lateOn('habits', k, h.id)) late++; }
    const x = per[h.id] || (per[h.id] = { h, p: 0, d: 0 }); x.p++; if (ok) x.d++;
  }
  return { planned: p, done: d, late, pct: pct(d, p), onTime: pct(d - late, p), per: Object.values(per).map(x => ({ ...x, rate: pct(x.d, x.p) })) };
}
function fitStatsRange(s, e, tk = todayKey()){

  for (let k = s; k <= e && k <= tk; k = addKey(k, 1)) { const r = fitDay(k); p += r.planned; d += r.done; if (state.late.fit[k]) late += r.items.filter(x => isChecked(k, itemKey(x)) && lateOn('fit', k, itemKey(x))).length; }
  const ss = state.fit.sessions.filter(x => x.date >= s && x.date <= e);
  return { planned: p, done: d, late, pct: pct(d, p), sessions: ss.length, minutes: ss.reduce((a, x) => a + (x.duration || 0), 0) };
}
function movesRange(g, s, e){
  const out = [];
  for (const d in state.moves[g]) if (d >= s && d <= e) for (const id in state.moves[g][d]) out.push({ d, id, m: state.moves[g][d][id] });

}
const meanOf = arr => { const v = arr.filter(x => x != null); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; };

    const av = AREAS.filter(([k]) => sc[k] != null).map(([k, l]) => ({ k, l, v: sc[k] }));
    if (av.length) {
      const best = [...av].sort((a, b) => b.v - a.v)[0], worst = [...av].sort((a, b) => a.v - b.v)[0];
      lines.push(`<strong>${P.label}${isCur ? ' (até hoje)' : ''}:</strong> média geral de <strong class="num">${sc.g}%</strong>, ${verdict(sc.g)}.`);
      if (av.length > 1 && best.k !== worst.k) lines.push(`Ponto forte: <strong>${best.l.toLowerCase()}</strong> (${best.v}%). Ponto a melhorar: <strong>${worst.l.toLowerCase()}</strong> (${worst.v}%).`);
      const ups = av.filter(a => pv[a.k] != null && a.v - pv[a.k] >= 5), downs = av.filter(a => pv[a.k] != null && pv[a.k] - a.v >= 5);
      if (ups.length || downs.length) lines.push(`Em relação ao ${prevName}: ${[...ups.map(a => `${a.l.toLowerCase()} subiu ${a.v - pv[a.k]} pts`), ...downs.map(a => `${a.l.toLowerCase()} caiu ${pv[a.k] - a.v} pts`)].join('; ')}.`);
      else if (av.some(a => pv[a.k] != null)) lines.push(`Em relação ao ${prevName}, as áreas ficaram estáveis (variação menor que 5 pts).`);
    } else lines.push('Ainda não há dados neste período.');
    const allMoves = tMoves.length + hm.filter(x => !x.m.c).length + fm.filter(x => !x.m.c).length;
    if (allMoves) {
      const rc = {}; [...tMoves.map(x => x.e.r), ...hm.filter(x => !x.m.c).map(x => x.m.r), ...fm.filter(x => !x.m.c).map(x => x.m.r)].forEach(r => rc[r] = (rc[r] || 0) + 1);
      const top = Object.entries(rc).sort((a, b) => b[1] - a[1])[0];
      lines.push(`${allMoves} ${allMoves === 1 ? 'adiamento' : 'adiamentos'} no período; o motivo mais comum foi <strong>${esc((REASON_L[top[0]] || 'Não informado').toLowerCase())}</strong> (${top[1]}).`);
    }
    const lateN = H.late + F.late + T.cnt.atraso_feita;
    if (lateN) lines.push(`${lateN} ${lateN === 1 ? 'item foi feito' : 'itens foram feitos'} depois do dia planejado (contam como feitos, mas não como "no dia").`);
    const canc = tCanc.length + hm.filter(x => x.m.c).length + fm.filter(x => x.m.c).length;
    if (canc) lines.push(`${canc} ${canc === 1 ? 'item cancelado' : 'itens cancelados'}.${(rcOf => rcOf.errado ? ` ${rcOf.errado} por planejamento errado.` : '')(countBy([...tCanc.map(x => x.t.cancel?.r), ...hm.filter(x => x.m.c).map(x => x.m.r), ...fm.filter(x => x.m.c).map(x => x.m.r)]))}`);
  }

  // evolução
  const nB = { semana: 8, mes: 6, tri: 4, ano: 12 }[mode];
  const buckets = [];
  if (mode === 'ano') { for (let m = 0; m < 12; m++) { const k = ymd(new Date(parseYmd(P.s).getFullYear(), m, 1)), pr = periodOf('mes', k); buckets.push({ label: pr.label, short: pr.short, sc: scores(pr.s, pr.e), cur: pr.s <= tk && pr.e >= tk }); } }
  else for (let i = nB - 1; i >= 0; i--) { const pr = periodOf(mode, shiftRef(mode, P.s, -i)); buckets.push({ label: pr.label, short: pr.short, sc: scores(pr.s, pr.e), cur: i === 0 }); }

  // tarefas
  const funnel = [['no_dia', 'Feitas no dia', 'var(--teal)'], ['adiada_feita', 'Adiadas e feitas', 'color-mix(in srgb,var(--teal) 55%,var(--surface))'], ['atraso_feita', 'Feitas com atraso', 'var(--sand)'], ['atrasada', 'Atrasadas (em aberto)', 'var(--terra)'], ['cancelada', 'Canceladas', 'var(--ink-3)'], ['adiada_aberta', 'Adiadas, ainda no prazo', 'var(--line-strong)'], ['pendente', 'No prazo, a fazer', 'var(--line-strong)']];
  const reasonRows = list => { const c = countBy(list); return Object.entries(c).sort((a, b) => b[1] - a[1]).map(([r, v]) => ({ l: REASON_L[r] || 'Não informado', v })); };
  const postR = reasonRows([...tMoves.map(x => x.e.r), ...hm.filter(x => !x.m.c).map(x => x.m.r), ...fm.filter(x => !x.m.c).map(x => x.m.r)]);
  const cancR = reasonRows([...tCanc.map(x => x.t.cancel?.r || 'nd'), ...hm.filter(x => x.m.c).map(x => x.m.r), ...fm.filter(x => x.m.c).map(x => x.m.r)]);
  const mostMoved = state.tasks.map(t => ({ t, n: taskMoves(t).length })).filter(x => x.n >= 2 && (taskPlan(x.t) || '') <= P.e && (x.t.date || taskPlan(x.t) || '') >= P.s).sort((a, b) => b.n - a.n).slice(0, 5);
  const byCat = state.categories.map(c => { const l = T.list.filter(x => x.t.category === c.id), done = l.filter(x => ['no_dia', 'adiada_feita', 'atraso_feita'].includes(x.o)).length, base = done + l.filter(x => x.o === 'atrasada').length; return { c, n: l.length, p: pct(done, base) }; }).filter(x => x.n);
  // dia da semana
  const dow = orderedDows().map(w => {
    let hp = 0, hd = 0, fp = 0, fd = 0; const tl = T.list.filter(x => dowOf(taskPlan(x.t)) === w);
    for (let k = P.s; k <= upto; k = addKey(k, 1)) if (dowOf(k) === w) { const a = habitDay(k), b = fitDay(k); hp += a.planned; hd += a.done; fp += b.planned; fd += b.done; }
    const td = tl.filter(x => ['no_dia', 'adiada_feita', 'atraso_feita'].includes(x.o)).length, tb = td + tl.filter(x => x.o === 'atrasada').length;
    return { w, h: pct(hd, hp), t: pct(td, tb), f: pct(fd, fp) };

  const hper = H.per.filter(x => x.p >= 2).sort((a, b) => b.rate - a.rate);

  return `

function countBy(arr){ const c = {}; arr.forEach(x => { const k = x || 'nd'; c[k] = (c[k] || 0) + 1; }); return c; }

Object.assign(A, {

/* =========================================================================
   8. Sincronização entre aparelhos — dois caminhos, mesma regra
   • GitHub (gratuito): os dados ficam num Gist PRIVADO da conta do usuário
     (arquivo controle-atividades.json). Cada aparelho guarda a própria chave
     de acesso (só permissão "gist") no navegador; ela nunca vai para a nuvem.
     Funciona no endereço do GitHub Pages (e no arquivo aberto no notebook).
   • Claude (plano Pro): quando aberto pelo link do Claude com a conta
     conectada, usa a área privada do usuário (data/users/<id>/…).
   Regra comum: vale a alteração mais recente (updatedAt). Um aparelho novo,
   só com os dados de exemplo, nunca sobrescreve dados reais.
   ========================================================================= */
const SYNC = { p: null, kind: '', status: 'off', reason: '', lastAt: null, rev: null, pushing: false, again: false, dirty: false, timer: null, retry: null, pending: null, device: '', code: '', login: '' };
const GH_KEY = 'controle-atividades:github', GIST_FILE = 'controle-atividades.json';
const inClaude = () => !!(window.claude && typeof window.claude.use === 'function');

function syncCode(id){ let h = 2166136261; for (const c of String(id)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36).toUpperCase().slice(0, 4).padStart(4, '0'); }
function syncDeviceId(){
  try { let d = localStorage.getItem('ritmo-semanal:device'); if (!d) { d = uid(); localStorage.setItem('ritmo-semanal:device', d); } return d; }
  catch (e) { return 'tmp' + uid(); }
}
function ghLoad(){ try { return JSON.parse(localStorage.getItem(GH_KEY) || 'null'); } catch (e) { return null; } }
function ghSave(cfg){ try { if (cfg) localStorage.setItem(GH_KEY, JSON.stringify(cfg)); else localStorage.removeItem(GH_KEY); } catch (e) { /* sem armazenamento */ } }

const SYNC_REASON = {
  'gh-setup': 'Sincronização desligada neste aparelho. Conecte sua conta do GitHub abaixo (uma vez em cada aparelho) para ver os mesmos dados no celular e no notebook.',
  'sem-conta': 'Aberto pelo link do Claude, mas sem a conta conectada ou sem o plano que guarda dados. Use o endereço do GitHub com a sincronização gratuita.',
};
function syncLabel(){
  const t = SYNC.lastAt ? fromMin(new Date(SYNC.lastAt).getHours() * 60 + new Date(SYNC.lastAt).getMinutes()) : '';
  return {
    off: `${icon('inbox', 'ic-sm')}Salvo só neste aparelho`,
    syncing: `${icon('repeat', 'ic-sm')}Sincronizando…`,
    ok: `${icon('check', 'ic-sm')}Sincronizado${t ? ' às ' + t : ''}`,
    offline: `${icon('alert', 'ic-sm')}Sem internet · sincroniza quando voltar`,
    error: `${icon('alert', 'ic-sm')}Não sincronizou agora · tentando de novo`,
  }[SYNC.status];
}
const syncWho = () => SYNC.kind === 'github' ? `GitHub @${SYNC.login}` : SYNC.kind === 'claude' ? `conta ${SYNC.code}` : '';
function setSync(status){
  SYNC.status = status;
  $$('[data-sync-status]').forEach(el => { el.innerHTML = syncLabel() + (el.classList.contains('sync-chip') && syncWho() ? ` · ${syncWho()}` : ''); el.dataset.state = status; });
}

/* ---------- Provedor: GitHub Gist privado ---------- */
const GithubP = {
  cfg: null, cache: null,
  async api(path, opt = {}){
    let r;
    try {
      r = await fetch('https://api.github.com' + path, { ...opt, cache: 'no-store',
        headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + this.cfg.token, ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } });
    } catch (e) { throw { code: 'rede' }; }
    if (!r.ok) throw { code: r.status === 401 ? 'chave' : r.status === 403 || r.status === 404 ? 'permissao' : 'falha', status: r.status };
    return r.json();
  },
  content(json){ return `{"app":"controle-atividades","updatedAt":${state.meta.updatedAt || 0},"pristine":${!!state.meta.pristine},"device":"${SYNC.device}","state":${json}}`; },
  rev: g => (g.history && g.history[0] && g.history[0].version) || g.updated_at,
  async meta(){
    const g = await this.api('/gists/' + this.cfg.gistId), f = g.files && g.files[GIST_FILE];
    if (!f) return null;
    let txt = f.content;
    if (f.truncated) txt = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
    const doc = JSON.parse(txt); this.cache = doc;
    return { rev: this.rev(g), updatedAt: doc.updatedAt || 0, pristine: !!doc.pristine, device: doc.device };
  },
  async pull(){ return this.cache.state; },
  async push(json){
    const g = await this.api('/gists/' + this.cfg.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content: this.content(json) } } }) });
    return this.rev(g);
  },
  watch(cb){
    setInterval(async () => {
      if (document.visibilityState !== 'visible' || SYNC.pushing || SYNC.p !== this) return;
      try { cb(await this.meta()); } catch (e) { /* tenta na próxima */ }
    }, 30000);
  },
};

/* ---------- Provedor: armazenamento do Claude (plano Pro) ---------- */
const ClaudeP = {
  db: null, uid: null, n: 0, chunk: 90000,
  col(){ return 'data/users/' + this.uid; },
  async meta(){ const s = await this.db.doc(this.col() + '/manifest').get(); return s.exists ? s.data() : null; },
  async pull(m, attempt = 0){
    const parts = await Promise.all(Array.from({ length: m.n }, (_, i) => this.db.doc(this.col() + '/p' + i).get()));
    if (!parts.every(p => p.exists && p.data().rev === m.rev)) {
      if (attempt >= 4) throw { code: 'incompleto' };
      await new Promise(r => setTimeout(r, 1500)); return this.pull(m, attempt + 1); // outro aparelho ainda gravando
    }
    this.n = m.n;
    return JSON.parse(parts.map(p => p.data().s).join(''));
  },
  async push(json){
    const rev = uid(), n = Math.max(1, Math.ceil(json.length / this.chunk));
    for (let i = 0; i < n; i++) await this.db.doc(this.col() + '/p' + i).set({ rev, i, s: json.slice(i * this.chunk, (i + 1) * this.chunk) });
    await this.db.doc(this.col() + '/manifest').set({ rev, n, updatedAt: state.meta.updatedAt || 0, pristine: !!state.meta.pristine, device: SYNC.device, at: Date.now() });
    for (let i = n; i < this.n; i++) { try { await this.db.doc(this.col() + '/p' + i).delete(); } catch (e) { /* sobra antiga */ } }
    this.n = n; return rev;
  },
  watch(cb){ try { this.db.doc(this.col() + '/manifest').onSnapshot(s => { if (s.exists) cb(s.data()); }, () => setSync('error')); } catch (e) { setSync('error'); } },
};

/* ---------- Motor comum ---------- */
let syncListeners = false;
async function syncStart(){
  SYNC.device = syncDeviceId();
  const cfg = ghLoad();
  if (cfg && cfg.token && cfg.gistId && !inClaude()) { await syncUse(GithubP, 'github', () => { GithubP.cfg = cfg; SYNC.login = cfg.login || ''; }); return; }
  if (!inClaude()) { SYNC.reason = 'gh-setup'; setSync('off'); return; }
  let db = null, user = null, id = null;
  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { /* sem capacidade */ }
  try { id = user ? await user.id() : null; } catch (e) { /* sem id */ }
  if (!db || !id) { SYNC.reason = 'sem-conta'; setSync('off'); render(); return; }
  await syncUse(ClaudeP, 'claude', () => { ClaudeP.db = db; ClaudeP.uid = id; SYNC.code = syncCode(id); });
}
async function syncUse(p, kind, init){
  init(); SYNC.p = p; SYNC.kind = kind; SYNC.reason = '';
  setSync('syncing'); render();
  await syncReconcile(true);
  p.watch(m => {
    if (!m || SYNC.p !== p) return;
    if (m.device === SYNC.device || m.rev === SYNC.rev) return;
    if (m.pristine && !state.meta.pristine) return;
    if (!state.meta.pristine && (m.updatedAt || 0) <= (state.meta.updatedAt || 0)) return;
    syncPull(m, false);
  });
  if (syncListeners) return; syncListeners = true;
  window.addEventListener('online', () => { if (SYNC.dirty) syncPushNow(); else syncReconcile(false); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && SYNC.dirty) syncPushNow();   // celular: envia antes de sair
    if (document.visibilityState === 'visible') syncReconcile(false);        // ao voltar: busca novidades
  });
}
function syncFail(e){
  if (e && e.code === 'chave') { setSync('error'); toast('A chave do GitHub não vale mais. Conecte de novo em Ajustes.'); return; }
  setSync(navigator.onLine === false || (e && e.code === 'rede') ? 'offline' : 'error');
}

/* Compara com a nuvem e decide: baixar, enviar ou nada. */
async function syncReconcile(initial){
  const p = SYNC.p; if (!p) return;
  try {
    const m = await p.meta(), local = state.meta.updatedAt || 0;
    if (!m || (m.pristine && !state.meta.pristine)) await syncPushNow();          // nuvem vazia ou só com exemplos
    else if (state.meta.pristine || (m.updatedAt || 0) > local) { if (m.rev !== SYNC.rev) await syncPull(m, initial); else setSync('ok'); }
    else if (local > (m.updatedAt || 0)) await syncPushNow();
    else { SYNC.rev = m.rev; SYNC.lastAt = Date.now(); setSync('ok'); }
  } catch (e) { syncFail(e); }
}
async function syncPull(m, initial){
  try {
    setSync('syncing');
    const obj = await SYNC.p.pull(m);
    SYNC.pending = { obj, m, initial };
    syncApplyPending();
  } catch (e) { syncFail(e); }
}

/* Aplica a versão recebida — espera se houver uma janela aberta ou um campo em edição. */
function syncApplyPending(){
  const p = SYNC.pending; if (!p) return;
  const a = document.activeElement;
  if (modalOpen() || (a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.type !== 'checkbox' && a.type !== 'password' && a.value.trim())) return;
  SYNC.pending = null;
  state = normalize(p.obj); state.meta.pristine = false;
  saveLocal();
  SYNC.rev = p.m.rev; SYNC.lastAt = Date.now(); SYNC.dirty = false;
  resetUiWeeks(); applyTheme(); render(); setSync('ok');
  if (!p.initial) toast('Atualizado com o que você marcou no outro aparelho.');
}
document.addEventListener('focusout', () => setTimeout(syncApplyPending, 250));
setInterval(() => syncApplyPending(), 5000);

function syncPush(){
  if (!SYNC.p) return;
  SYNC.dirty = true; clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(syncPushNow, 1500);
}
async function syncPushNow(){
  const p = SYNC.p; if (!p) return;
  clearTimeout(SYNC.timer); clearTimeout(SYNC.retry);
  if (SYNC.pushing) { SYNC.again = true; return; }
  SYNC.pushing = true; SYNC.dirty = false; setSync('syncing');
  try {
    if (!state.meta.updatedAt && !state.meta.pristine) { state.meta.updatedAt = Date.now(); saveLocal(); } // dados de antes da sincronização
    SYNC.rev = await p.push(JSON.stringify(state));
    SYNC.lastAt = Date.now(); setSync('ok');
  } catch (e) {
    SYNC.dirty = true;
    if (e && e.code === 'quota_exceeded') { setSync('error'); toast('O espaço de sincronização encheu. Faça um backup e limpe registros antigos.'); }
    else { syncFail(e); if (!(e && e.code === 'chave')) SYNC.retry = setTimeout(syncPushNow, 15000); }
  } finally {
    SYNC.pushing = false;
    if (SYNC.again) { SYNC.again = false; syncPushNow(); }
  }
}
async function syncNow(){
  if (!SYNC.p) return;
  if (SYNC.dirty) await syncPushNow(); else await syncReconcile(false);
  toast(SYNC.status === 'ok' ? 'Tudo sincronizado.' : 'Não foi possível sincronizar agora.');
}

/* ---------- Conectar / desconectar o GitHub ---------- */
async function ghConnect(token){
  token = String(token || '').trim();
  if (!/^(ghp_|github_pat_)[A-Za-z0-9_]{20,}$/.test(token)) { toast('Essa chave não parece do GitHub. Ela começa com ghp_ ou github_pat_.'); return; }
  const btn = $('[data-act="gh-connect"]'); if (btn) { btn.disabled = true; btn.textContent = 'Conectando…'; }
  GithubP.cfg = { token };
  try {
    const u = await GithubP.api('/user');
    const list = await GithubP.api('/gists?per_page=100');
    const found = list.find(g => g.files && g.files[GIST_FILE]);
    let gistId = found && found.id, created = false;
    if (!gistId) {
      const g = await GithubP.api('/gists', { method: 'POST', body: JSON.stringify({ description: 'Controle de Atividades — dados do app (privado, não apague)', public: false, files: { [GIST_FILE]: { content: GithubP.content(JSON.stringify(state)) } } }) });
      gistId = g.id; created = true; SYNC.rev = GithubP.rev(g);
    }
    const cfg = { token, gistId, login: u.login };
    ghSave(cfg);
    await syncUse(GithubP, 'github', () => { GithubP.cfg = cfg; SYNC.login = u.login; });
    toast(created ? `Conectado como @${u.login}. Seus dados foram guardados no GitHub.` : `Conectado como @${u.login}. Dados sincronizados com o outro aparelho.`);
  } catch (e) {
    GithubP.cfg = null;
    toast({ chave: 'Chave inválida ou expirada. Gere uma nova no GitHub.', permissao: 'A chave precisa da permissão “gist”. Gere de novo marcando “gist”.', rede: 'Sem conexão com o GitHub. Verifique a internet.' }[e && e.code] || 'Não foi possível conectar agora. Tente de novo.');
  }
  render();
}
function ghDisconnect(){
  ghSave(null); SYNC.p = null; SYNC.kind = ''; SYNC.login = ''; SYNC.reason = 'gh-setup'; setSync('off'); render();
  toast('Este aparelho foi desconectado. Os dados continuam salvos aqui e no seu GitHub.');
}

/* ---------- Card nas Configurações ---------- */
function syncPanel(){
  const head = `<div class="set-row"><div class="txt"><strong class="sync-status" data-sync-status data-state="${SYNC.status}">${syncLabel()}</strong>
      <span class="hint">${SYNC.kind === 'github' ? `Conectado ao GitHub como <strong>@${esc(SYNC.login)}</strong>. Os dados ficam num arquivo privado da sua conta. Conecte o outro aparelho com o mesmo usuário. Se marcar nos dois sem internet, vale a alteração feita por último.`
        : SYNC.kind === 'claude' ? `Pela sua conta do Claude · código <strong class="num">${SYNC.code}</strong> (precisa ser igual nos dois aparelhos).`
        : (SYNC_REASON[SYNC.reason] || 'Verificando a conexão…')}</span></div>
      ${SYNC.p ? `<button class="btn btn-sm" data-act="sync-now">${icon('repeat', 'ic-sm')}Sincronizar agora</button>` : ''}</div>`;
  let gh = '';
  if (inClaude()) {
    gh = `<div class="set-row"><div class="txt"><strong>Sincronização gratuita pelo GitHub</strong><span class="hint">Não funciona dentro do link do Claude. Para não depender do plano Pro, abra o app pelo endereço do GitHub (ex.: seu-usuario.github.io/Controle-de-Atividades) e conecte lá, em Ajustes.</span></div></div>`;
  } else if (SYNC.kind === 'github') {
    gh = `<div class="set-row"><div class="txt"><strong>GitHub conectado neste aparelho</strong><span class="hint">Para trocar de conta ou de chave, desconecte e conecte de novo.</span></div>
      <button class="btn btn-sm btn-danger" data-act="gh-disconnect">Desconectar este aparelho</button></div>`;
  } else {
    gh = `<div class="gh-setup">
      <strong>Conectar ao GitHub (grátis, uma vez em cada aparelho)</strong>
      <ol>
        <li>Abra <a href="https://github.com/settings/tokens/new?scopes=gist&description=Controle%20de%20Atividades" target="_blank" rel="noopener">github.com › criar chave</a> (entre na sua conta, se pedir).</li>
        <li>Em <em>Expiration</em>, escolha <strong>No expiration</strong>. Deixe marcado só <strong>gist</strong>.</li>
        <li>Clique em <strong>Generate token</strong> e copie a chave (começa com <code>ghp_</code>).</li>
        <li>Cole aqui e toque em Conectar. No outro aparelho, gere outra chave ou use a mesma.</li>
      </ol>
      <div class="newcat" style="flex-wrap:wrap"><input id="gh-token" class="input" type="password" autocomplete="off" spellcheck="false" placeholder="Cole a chave ghp_…" style="flex:1 1 220px" data-enter="gh-connect" aria-label="Chave do GitHub">
        <button class="btn btn-primary" data-act="gh-connect">${icon('check', 'ic-sm')}Conectar</button></div>
      <span class="hint">A chave fica guardada só neste aparelho e dá acesso apenas aos seus Gists (anotações), não aos seus repositórios.</span>
    </div>`;
  }
  return `<section class="panel"><div class="panel-head"><h2>Sincronização entre aparelhos</h2></div>${head}${gh}</section>`;
}
Object.assign(A, {
  'sync-now'(){ syncNow(); },
  'gh-connect'(){ ghConnect($('#gh-token') && $('#gh-token').value); },
  'gh-disconnect'(){ confirmBox({ title: 'Desconectar o GitHub', text: 'Este aparelho para de sincronizar. Nada é apagado: os dados ficam aqui e no seu GitHub.', ok: 'Desconectar', onOk: ghDisconnect }); },
});

/* Backup: no link do Claude, o download passa pela permissão de downloads do app */
const _exportDl = A['export-dl'];
A['export-dl'] = async function(el){
  let dl = null;
  try { dl = inClaude() ? await window.claude.use('downloads') : null; } catch (e) { /* sem downloads */ }
  if (!dl) return _exportDl(el);
  try { await dl.save({ filename: `controle-atividades-backup-${todayKey()}.json`, data: backupJSON() }); toast('Backup salvo.'); }
  catch (e) { toast('O download não foi concluído. Use “Copiar backup”.'); }
};

/* =========================================================================
   9. Seletores de hora e data
   Todo campo com data-mask="time" ou data-mask="date" abre um seletor ao
   ser tocado. Hora: já vem com o horário atual do aparelho (ou início + 1h
   no campo de fim), em duas colunas para tocar (horas e minutos).
   Data: calendário do mês com hoje destacado. No celular o teclado não
   abre; no notebook ainda dá para digitar, se preferir.
   ========================================================================= */
const PK = { el: null, input: null, kind: '', h: 0, m: 0, view: null };
const pkCoarse = () => window.matchMedia && matchMedia('(pointer: coarse)').matches;
const pkSheet = () => window.matchMedia && matchMedia('(max-width: 640px)').matches;

function pkClose(){ if (PK.el) PK.el.remove(); PK.el = null; PK.input = null; }
function pkEmit(input){ PK.emitting = true; input.dispatchEvent(new Event('input', { bubbles: true })); input.dispatchEvent(new Event('change', { bubbles: true })); PK.emitting = false; }
/* Campo "fim": sugere início + 1h quando o início já está preenchido. */
function pkPairStart(input){
  const id = input.id || ''; if (!/end$/.test(id)) return null;
  const s = document.getElementById(id.replace(/end$/, 'start'));
  return s && isTime(s.value) ? s.value : null;
}
function pkSetTime(){ PK.input.value = `${pad(PK.h)}:${pad(PK.m)}`; pkEmit(PK.input); }

function pkOpen(input){
  if (PK.input === input && PK.el) return;
  pkClose();
  PK.input = input; PK.kind = input.dataset.mask;
  const el = document.createElement('div');
  el.className = 'picker' + (pkSheet() ? ' pk-sheet' : '');
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-label', PK.kind === 'time' ? 'Escolher horário' : 'Escolher data');
  document.body.appendChild(el); PK.el = el;
  if (PK.kind === 'time') {
    let v = input.value;
    if (!isTime(v)) {
      const st = pkPairStart(input), n = new Date();
      v = st ? fromMin(Math.min(toMin(st) + 60, 23 * 60 + 59)) : `${pad(n.getHours())}:${pad(n.getMinutes())}`;
      input.value = v; pkEmit(input);
    }
    PK.h = +v.slice(0, 2); PK.m = +v.slice(3);
  } else {
    const k = parseBR(input.value) || todayKey(), d = parseYmd(k);
    PK.view = new Date(d.getFullYear(), d.getMonth(), 1);
  }
  el.addEventListener('click', pkClick);
  pkRender(true);
}

function pkRender(scroll){
  if (!PK.el) return;
  if (!document.contains(PK.input)) { pkClose(); return; }
  if (PK.kind === 'time') {
    PK.el.innerHTML = `
      <div class="pk-head"><span class="pk-big num">${pad(PK.h)}:${pad(PK.m)}</span><button class="icon-btn sm" data-pk="close" aria-label="Fechar">${icon('x')}</button></div>
      <div class="pk-labels"><span>Hora</span><span>Minuto</span></div>
      <div class="pk-cols">
        <div class="pk-col" data-col="h">${Array.from({ length: 24 }, (_, i) => `<button class="pk-opt num ${i === PK.h ? 'is-sel' : ''}" data-pk="h" data-v="${i}">${pad(i)}</button>`).join('')}</div>
        <div class="pk-col" data-col="m">${Array.from({ length: 60 }, (_, i) => `<button class="pk-opt num ${i === PK.m ? 'is-sel' : ''}" data-pk="m" data-v="${i}">${pad(i)}</button>`).join('')}</div>
      </div>
      <div class="pk-foot"><button class="btn btn-sm btn-ghost" data-pk="now">Agora</button><button class="btn btn-sm btn-ghost" data-pk="clear">Limpar</button><span class="spacer"></span><button class="btn btn-sm btn-primary" data-pk="close">Pronto</button></div>`;
    if (scroll) $$('.pk-col', PK.el).forEach(col => { const s = $('.is-sel', col); if (s) col.scrollTop = s.offsetTop - col.clientHeight / 2 + s.offsetHeight / 2; });
  } else {
    const v = PK.view, sel = parseBR(PK.input.value), tk = todayKey(), max = PK.input.dataset.max === 'today' ? tk : null, min = isYmd(PK.input.dataset.min) ? PK.input.dataset.min : null;
    const first = (v.getDay() - state.settings.weekStart + 7) % 7, days = new Date(v.getFullYear(), v.getMonth() + 1, 0).getDate();
    PK.el.innerHTML = `
      <div class="pk-head"><button class="icon-btn sm" data-pk="prev" aria-label="Mês anterior">${icon('left')}</button>
        <strong class="pk-month">${cap(MON_L[v.getMonth()])} de ${v.getFullYear()}</strong>
        <button class="icon-btn sm" data-pk="next" aria-label="Próximo mês">${icon('right')}</button></div>
      <div class="pk-grid">${orderedDows().map(d => `<span class="pk-dow">${DOW_S[d].slice(0, 3)}</span>`).join('')}
        ${'<span></span>'.repeat(first)}
        ${Array.from({ length: days }, (_, i) => { const k = ymd(new Date(v.getFullYear(), v.getMonth(), i + 1));
          return `<button class="pk-day num ${k === tk ? 'is-today' : ''} ${k === sel ? 'is-sel' : ''}" data-pk="d" data-v="${k}" ${(max && k > max) || (min && k < min) ? 'disabled' : ''}>${i + 1}</button>`; }).join('')}
      </div>
      <div class="pk-foot"><button class="btn btn-sm btn-ghost" data-pk="today">Hoje</button>${PK.input.id === 'f-date' ? '<button class="btn btn-sm btn-ghost" data-pk="clear">Sem data</button>' : ''}<span class="spacer"></span><button class="btn btn-sm" data-pk="close">Fechar</button></div>`;
  }
  pkPlace();
}

function pkPlace(){
  if (!PK.el || PK.el.classList.contains('pk-sheet')) return;
  const r = PK.input.getBoundingClientRect(), w = PK.el.offsetWidth, h = PK.el.offsetHeight;
  let top = r.bottom + 6; if (top + h > innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
  PK.el.style.top = Math.max(8, top) + 'px';
  PK.el.style.left = clamp(r.left, 8, innerWidth - w - 8) + 'px';
}

function pkClick(e){
  const b = e.target.closest('[data-pk]'); if (!b || b.disabled) return;
  e.preventDefault();
  const a = b.dataset.pk, input = PK.input;
  if (a === 'close') { pkClose(); return; }
  if (PK.kind === 'time') {
    if (a === 'h') PK.h = +b.dataset.v;
    if (a === 'm') PK.m = +b.dataset.v;
    if (a === 'now') { const n = new Date(); PK.h = n.getHours(); PK.m = n.getMinutes(); }
    if (a === 'clear') { input.value = ''; pkEmit(input); pkClose(); return; }
    pkSetTime();
    // atualiza só a seleção, sem pular a rolagem das colunas
    $('.pk-big', PK.el).textContent = `${pad(PK.h)}:${pad(PK.m)}`;
    $$('[data-pk="h"]', PK.el).forEach(x => x.classList.toggle('is-sel', +x.dataset.v === PK.h));
    $$('[data-pk="m"]', PK.el).forEach(x => x.classList.toggle('is-sel', +x.dataset.v === PK.m));
    if (a === 'now') $$('.pk-col', PK.el).forEach(col => { const s = $('.is-sel', col); if (s) col.scrollTop = s.offsetTop - col.clientHeight / 2 + s.offsetHeight / 2; });
    return;
  }
  if (a === 'prev' || a === 'next') { PK.view = new Date(PK.view.getFullYear(), PK.view.getMonth() + (a === 'next' ? 1 : -1), 1); pkRender(); return; }
  if (a === 'd' || a === 'today') { const k = a === 'd' ? b.dataset.v : todayKey(); pkClose(); input.value = fmtBR(k); pkEmit(input); return; }
  if (a === 'clear') { pkClose(); input.value = ''; pkEmit(input); }
}

/* Abre ao tocar/focar; no celular não abre o teclado. */
document.addEventListener('pointerdown', e => {
  const inp = e.target.closest && e.target.closest('input[data-mask]');
  if (inp && pkCoarse()) inp.readOnly = true;
  if (PK.el && !PK.el.contains(e.target) && e.target !== PK.input) pkClose();
}, true);
document.addEventListener('click', e => { const inp = e.target.closest && e.target.closest('input[data-mask]'); if (inp) pkOpen(inp); });
document.addEventListener('focusin', e => { const t = e.target; if (t.matches && t.matches('input[data-mask]') && !pkCoarse()) pkOpen(t); });
document.addEventListener('keydown', e => {
  if (!PK.el) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); pkClose(); }
  if (e.key === 'Tab') pkClose();
}, true);
document.addEventListener('input', e => {
  // digitando no notebook: o seletor acompanha
  if (PK.emitting || !PK.el || e.target !== PK.input || PK.kind !== 'time' || !isTime(e.target.value)) return;
  PK.h = +e.target.value.slice(0, 2); PK.m = +e.target.value.slice(3); pkRender(true);
});
window.addEventListener('resize', () => pkPlace());
document.addEventListener('scroll', () => pkPlace(), true);

/* ---------- Início ---------- */
let state = loadState();
if (!state) { state = blankState(); seed(state); save(); }
/* Quem já usava a versão anterior recebe exemplos de treino (removíveis em Configurações). */
if (!state.meta.fitSeeded) { if (!state.fit.sessions.length && !state.fit.templates.length) seedFit(state); state.meta.fitSeeded = true; save(); }
/* Início do registro de adiamentos/cancelamentos (vale a partir desta versão). */
if (!state.meta.trackStart) state.meta.trackStart = todayKey();
trackTasks(); saveLocal(); // guarda a data planejada de cada tarefa já na abertura
try { localStorage.setItem('ritmo-semanal:teste', '1'); localStorage.removeItem('ritmo-semanal:teste'); } catch (e) { storageOK = false; }

const ui = {
  view: 'hoje', entering: true, justToggled: null, resetCal: true, lastDay: todayKey(),
  habitDate: todayKey(),
  agendaMode: 'semana', agendaDay: todayKey(), agendaWeek: '',
  filters: { q: '', cat: '', pri: '' },
  planWeek: '', planStep: 1,
  dashMode: 'mes', dashRef: todayKey(),
  fitTab: 'semana', fitWeek: '', fitFilter: '', fitLimit: 40, fitLogMode: 'semana', fitLogRef: '', fitEx: '', fitMetric: 'carga', fitEquip: 'Esteira', fitCardioMetric: 'speed',
};
resetUiWeeks();
try { const v = (location.hash || '').slice(1); if (VIEWS[v]) ui.view = v; } catch (e) { /* sem hash */ }
applyTheme();
render();
booting = false;
setInterval(tick, 20000);
syncStart();

</script>
