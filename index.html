   Ritmo Semanal — sistema visual
   Layout: menu lateral fixo (≥960px) + coluna de conteúdo de até 1200px;
   no celular, barra de navegação inferior fixa respeitando a área segura.
   ========================================================================= */
:root{
  --bg:#F6F3EE;          /* off-white quente */
  --surface:#FFFDF9;     /* superfícies elevadas */
  --surface-2:#F0EBE3;   /* hover / campos secundários */
  --track:#E9E2D7;       /* trilhos de anéis e barras */
  --line:#E4DDD2;
  --line-strong:#D3CABC;
  --ink:#1F2326;         /* grafite */
  --ink-2:#4B5156;
  --ink-3:#7B8187;
  --teal:#1F6F6B;        /* principal: verde-petróleo */
  --teal-strong:#185A57;
  --teal-soft:#DDEBE7;
  --on-teal:#FFFFFF;
  --terra:#D9694A;       /* destaque: terracota */

  --terra-ink:#A8452A;
  --on-terra:#FFFFFF;
  --sand:#D2AA5A;        /* apoio: areia/mostarda */

  --sand-ink:#7F6120;
  --ok:#3D8758;
  --t-mus:#1F6F6B; --t-car:#D9694A; --t-aula:#C9A04A; --t-esp:#5B7EA3; --t-out:#8A8278;
  --focus:#1F6F6B;
  --scrim:rgba(28,24,18,.38);
  --shadow-sm:0 1px 2px rgba(48,40,28,.05);
  --shadow:0 1px 2px rgba(48,40,28,.05),0 10px 28px -14px rgba(48,40,28,.18);
  --shadow-lg:0 28px 64px -24px rgba(28,22,14,.38);

  --font-display:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-body:"DM Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;

  --r-sm:8px; --r:12px; --r-lg:16px;
  --r-btn:10px; --r-input:10px; --r-card:14px; --r-pill:999px;
  --h-weight:500; --h-track:-.018em; --font-label:var(--font-body);
  --bg-tex:none; --bg-tex-size:auto;
  --hour:52px;
  --side:240px;
  color-scheme:light;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:16px;height:16px}
.num{font-variant-numeric:tabular-nums lining-nums}
.muted{color:var(--ink-3)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;font-weight:500}
h1{font-family:var(--font-display);font-size:clamp(28px,4.2vw,40px);line-height:1.08;letter-spacing:-.018em;font-variation-settings:"SOFT" 30}
h1.h1-sm{font-size:clamp(24px,3.2vw,32px)}
h2{font-family:var(--font-display);font-size:20px;line-height:1.2;letter-spacing:-.008em}
h3{font-size:14px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.hint{font-size:12.5px;color:var(--ink-3)}

/* ---------- Estrutura ---------- */
.app{min-height:100%}
.main{min-width:0;overflow-x:clip;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.view{max-width:1200px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.view.is-entering{animation:viewIn .24s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}

.sidebar{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 26px}
.brand-name{font-family:var(--font-display);font-size:23px;letter-spacing:-.02em;font-weight:500}
.brand svg{width:26px;height:26px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:10px;color:var(--ink-2);font-weight:500;font-size:14.5px;text-align:left;border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow-sm)}
.nav-btn[aria-current="page"] .ic{color:var(--teal);stroke-width:1.8}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 10px}
.side-date{font-size:13px;color:var(--ink-3);line-height:1.4}
.side-date strong{display:block;color:var(--ink-2);font-weight:500}
.theme-btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);padding:6px 10px 6px 8px;border-radius:8px;border:1px solid var(--line);align-self:flex-start;transition:background .15s}
.theme-btn:hover{background:var(--surface-2)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;
  background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:10.5px;font-weight:500;color:var(--ink-3);border-radius:10px;transition:color .15s,background .15s;min-width:0}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab:active{background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--teal)}
.tab[aria-current="page"] .ic{stroke-width:1.9}

@media (min-width:960px){
  .sidebar{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:var(--side);z-index:30;background:var(--bg);border-right:1px solid var(--line);
    padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:calc(14px + env(safe-area-inset-left,0px));padding-right:14px}
  .main{margin-left:var(--side);padding-bottom:0}
  .tabbar{display:none}
  .view{padding-block:40px 72px;padding-left:44px;padding-right:max(44px,env(safe-area-inset-right,0px));gap:28px}
}

/* ---------- Cabeçalhos de página e seções ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px}
.page-head .titles{display:flex;flex-direction:column;gap:6px;min-width:0}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head .meta{font-size:13px;color:var(--ink-3)}
.linkish{color:var(--teal);font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;border-radius:6px}
.linkish:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:500;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s,box-shadow .15s,color .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn .ic{width:18px;height:18px}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal);box-shadow:0 1px 0 rgba(255,255,255,.12) inset,var(--shadow-sm)}
.btn-primary:hover{background:var(--teal-strong);border-color:var(--teal-strong)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-danger{color:var(--terra-ink);border-color:color-mix(in srgb,var(--terra) 40%,var(--line))}
.btn-danger:hover{background:var(--terra-soft)}
.btn-danger-solid{background:var(--terra);border-color:var(--terra);color:var(--on-terra)}
.btn-danger-solid:hover{filter:brightness(.95)}
.btn-sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:9px;color:var(--ink-2);transition:background .15s,color .15s,transform .08s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.sm{width:30px;height:30px;border-radius:8px}
.icon-btn.sm .ic{width:17px;height:17px}
.icon-btn.danger:hover{color:var(--terra-ink);background:var(--terra-soft)}
.nav-group{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
.nav-group .btn{border-color:transparent;height:32px}

.seg{display:inline-flex;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;gap:2px;flex-wrap:wrap}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2);transition:background .15s,color .15s,box-shadow .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm),0 0 0 1px var(--line)}

.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
button.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:600;letter-spacing:.01em}
.badge.late{background:var(--terra-soft);color:var(--terra-ink)}
.badge.warn{background:var(--sand-soft);color:var(--sand-ink)}
.badge.doing{background:var(--teal-soft);color:var(--teal)}
.badge.paused{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}

/* ---------- Campos ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.input,.select,.textarea{width:100%;height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .15s}
.textarea{height:auto;min-height:92px;padding:10px 12px;resize:vertical;line-height:1.5}
.select{padding-right:8px}
.input::placeholder,.textarea::placeholder{color:var(--ink-3)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 20%,transparent)}
.input.invalid,.select.invalid{border-color:var(--terra);box-shadow:0 0 0 3px color-mix(in srgb,var(--terra) 16%,transparent)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .span2{grid-column:1/-1}
.date-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.date-row .input{flex:1 1 140px;max-width:180px}
.newcat{display:flex;gap:8px;align-items:center;margin-top:8px}
input[type="color"]{width:40px;height:40px;padding:3px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);cursor:pointer;flex:none}
.notice{padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.45;display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.notice .ic{width:18px;height:18px;margin-top:1px}
.notice.error{background:var(--terra-soft);color:var(--terra-ink)}
.notice.warn{background:var(--sand-soft);color:var(--sand-ink)}
.notice ul{margin:0;padding-left:16px}

/* ---------- Painéis ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm);min-width:0}
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 12px;margin-bottom:16px}
.panel-head .meta{font-size:13px;color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:14px;padding:18px 0;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--sand-soft);color:var(--sand-ink);font-size:14px}

/* ---------- Anel de progresso ---------- */
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .track{stroke:var(--track)}
.ring .prog{transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1),opacity .2s}
.ring .prog.zero{opacity:0}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.ring-value{font-family:var(--font-display);line-height:1;letter-spacing:-.03em;font-variant-numeric:lining-nums tabular-nums;font-weight:500}
.ring-value small{font-size:.42em;margin-left:1px;color:var(--ink-3);letter-spacing:0;font-weight:400}
.ring-sub{font-size:12.5px;color:var(--ink-3)}

/* ---------- Hoje ---------- */
.today-hero{display:grid;grid-template-columns:1fr;gap:16px}
.hero-ring{display:flex;flex-wrap:wrap;align-items:center;gap:24px 32px;padding:24px}
.hero-stats{display:grid;grid-template-columns:1fr;gap:16px;flex:1 1 220px;min-width:0}
.hstat{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.hstat:last-child{border-bottom:0;padding-bottom:0}
.hstat-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hstat .v{font-family:var(--font-display);font-size:28px;line-height:1;letter-spacing:-.02em}
.hstat .v span{font-size:16px;color:var(--ink-3);letter-spacing:0}
.meter{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.meter b{display:block;height:100%;border-radius:inherit;background:var(--teal);transition:width .9s cubic-bezier(.2,.7,.2,1)}
.meter.terra b{background:var(--terra)}
.meter.sand b{background:var(--sand)}
.hero-side{display:grid;grid-template-columns:1fr;gap:16px}
.next-card{display:flex;flex-direction:column;gap:6px}
.next-count{font-family:var(--font-display);font-size:34px;line-height:1.05;letter-spacing:-.02em;margin-top:4px}
.next-cap{font-size:13px;color:var(--ink-3)}
.next-title{font-weight:600;font-size:15.5px;margin-top:8px}
.next-meta{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.goals li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.goals li:first-child{border-top:0;padding-top:4px}
.goals .gn{font-family:var(--font-display);font-size:18px;color:var(--terra);line-height:1}
.two-col{display:grid;grid-template-columns:1fr;gap:28px}
@media (min-width:760px){
  .today-hero{grid-template-columns:1.25fr 1fr}
}
@media (min-width:1100px){
  .two-col{grid-template-columns:1fr 1.15fr}
}
.quick-add{display:flex;gap:8px;margin-top:12px}
.quick-add .input{flex:1;min-width:0}

/* ---------- Bloco de hábito (botão grande de marcar) ---------- */
.habit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.habit-list{display:flex;flex-direction:column;gap:8px}
.htile{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;transition:border-color .18s,background .25s,transform .1s,box-shadow .18s}
.htile:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.htile:active{transform:scale(.985)}
.htile.compact{min-height:52px;padding:9px 14px;border-radius:12px}
.box{width:28px;height:28px;border-radius:50%;border:1.6px solid var(--line-strong);display:grid;place-items:center;flex:none;transition:background .22s,border-color .22s,transform .2s}
.htile.compact .box{width:24px;height:24px}
.box svg{width:16px;height:16px;stroke:var(--on-teal);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset .28s ease-out .04s}
.htile.is-done{background:var(--teal-soft);border-color:color-mix(in srgb,var(--teal) 28%,transparent)}
.htile.is-done .box{background:var(--teal);border-color:var(--teal)}
.htile.is-done .box svg{stroke-dashoffset:0}
.htile.pop .box{animation:pop .34s cubic-bezier(.3,.7,.3,1.4)}
.htile.pop.is-done .box svg{animation:draw .3s .06s ease-out both}
@keyframes draw{from{stroke-dashoffset:14}to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.htxt{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.hname{font-weight:500;line-height:1.3}
.htile.is-done .hname{color:var(--ink-2)}
.hemoji{font-size:19px;line-height:1}
.htime{font-size:12.5px;color:var(--ink-3)}

/* ---------- Linha de tarefa ---------- */
.tlist{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow.with-actions{grid-template-columns:auto minmax(0,1fr) auto auto}
.tcheck{width:24px;height:24px;border-radius:8px;border:1.6px solid var(--line-strong);display:grid;place-items:center;transition:background .2s,border-color .2s;background:var(--surface)}
.tcheck:hover{border-color:var(--teal)}
.tcheck svg{width:15px;height:15px;stroke:var(--on-teal);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset .25s ease-out}
.tcheck.is-done{background:var(--teal);border-color:var(--teal)}
.tcheck.is-done svg{stroke-dashoffset:0}
.tcheck.pop{animation:pop .34s cubic-bezier(.3,.7,.3,1.4)}
.tcheck.pop.is-done svg{animation:draw .3s .06s ease-out both}
.tmain{min-width:0;cursor:pointer;border-radius:6px}
.ttitle{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.trow.is-done .ttitle{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-3)}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.trow.is-late .ttime{color:var(--terra-ink);font-weight:500}
.cat{display:inline-flex;align-items:center;gap:6px}
.cat-dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.pri{display:inline-flex;align-items:center}
.pri svg{width:14px;height:14px}
.pri rect{fill:var(--track)}
.pri-alta rect.on{fill:var(--terra)}
.pri-media rect.on{fill:var(--sand)}
.pri-baixa rect.on{fill:var(--ink-3)}
.row-actions{display:flex;gap:2px}
.late-group{border:1px solid color-mix(in srgb,var(--terra) 35%,var(--line));background:color-mix(in srgb,var(--terra-soft) 55%,var(--surface));border-radius:14px;padding:6px 14px;margin-bottom:14px}
.late-group .lg-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0 2px;color:var(--terra-ink);font-size:13px;font-weight:600}

/* ---------- Hábitos ---------- */
.datebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.datebar-label{display:flex;flex-direction:column;line-height:1.2;min-width:150px;padding:0 4px}
.datebar-label strong{font-family:var(--font-display);font-weight:500;font-size:19px}
.datebar-label span{font-size:13px;color:var(--ink-3)}
.date-jump{width:132px;height:34px}
.habits-top{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:900px){.habits-top{grid-template-columns:minmax(0,1.55fr) minmax(260px,.75fr)}}
.day-ring{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.day-ring .cap{font-size:13.5px;color:var(--ink-2);max-width:240px}
.week-top{display:flex;flex-wrap:wrap;align-items:center;gap:20px 28px;padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.week-top .wt-text{display:flex;flex-direction:column;gap:8px;flex:1 1 220px;min-width:0}
.delta{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:5px 10px;border-radius:8px;align-self:flex-start}
.delta .ic{width:16px;height:16px;stroke-width:2}
.delta.up{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.delta.down{background:var(--terra-soft);color:var(--terra-ink)}
.delta.flat{background:var(--surface-2);color:var(--ink-2)}
.big-num{font-family:var(--font-display);font-size:44px;line-height:1;letter-spacing:-.03em}
.big-num small{font-size:20px;color:var(--ink-3)}

/* Barras de 7 dias (HTML para texto nítido em qualquer largura) */
.bars{position:relative;padding-top:24px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(6px,1.6vw,16px);padding-left:34px}
.bars-axis{position:absolute;left:0;top:24px;bottom:44px;width:100%;pointer-events:none}
.bars-axis span{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:11px;color:var(--ink-3);line-height:0}
.bars-axis span i{position:absolute;left:0;top:0;font-style:normal;transform:translateY(-1px)}
.bars-axis span.base{border-top-style:solid;border-color:var(--line-strong)}
.bcol{display:flex;flex-direction:column;align-items:stretch;gap:8px;min-width:0;cursor:pointer;border-radius:8px}
.btrack{position:relative;height:170px;display:flex;align-items:flex-end;justify-content:center}
.bfill{position:relative;width:min(100%,46px);border-radius:7px 7px 3px 3px;background:color-mix(in srgb,var(--teal) 38%,var(--surface));transition:background .2s}
.bcol:hover .bfill{background:color-mix(in srgb,var(--teal) 55%,var(--surface))}
.bcol.is-today .bfill{background:var(--teal)}
.bcol.is-sel .blabel{color:var(--ink)}
.bcol.is-future .bfill{background:transparent;border:1.5px dashed var(--line-strong);height:100%!important;border-radius:7px}
.bval{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.bcol.is-future .bval{bottom:auto;top:50%;transform:translate(-50%,-50%);color:var(--ink-3);font-weight:500}
.blabel{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--ink-3);line-height:1.25;height:36px}
.blabel b{font-weight:600;color:var(--ink-2)}
.bcol.is-today .blabel b{color:var(--teal)}
.is-entering .bar-anim{animation:growH .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes growH{from{height:0}}

/* Linha de 8 semanas */
.weeks{position:relative;height:200px;margin:8px 0 0 34px}
.weeks svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.weeks .area{fill:color-mix(in srgb,var(--teal) 12%,transparent)}
.weeks .line{fill:none;stroke:var(--teal);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.weeks .avg{stroke:var(--sand);stroke-width:1.5;stroke-dasharray:5 5;vector-effect:non-scaling-stroke}
.weeks .gridl{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.wdot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--surface);border:2px solid var(--teal)}
.wdot.cur{background:var(--teal);width:12px;height:12px;margin:-6px 0 0 -6px}
.wval{position:absolute;transform:translate(-50%,-26px);font-size:12px;font-weight:600;white-space:nowrap}
.wavg{position:absolute;right:0;transform:translateY(5px);font-size:11.5px;color:var(--sand-ink);background:var(--surface);padding:0 4px}
.wlabels{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));margin:10px 0 0 34px;font-size:11.5px;color:var(--ink-3);text-align:center}
.wlabels .cur{color:var(--teal);font-weight:600}
.waxis{position:absolute;left:-34px;font-size:11px;color:var(--ink-3);transform:translateY(-50%)}
.is-entering .weeks .line{stroke-dasharray:3000;animation:drawLine 1.1s ease-out both}
@keyframes drawLine{from{stroke-dashoffset:3000}to{stroke-dashoffset:0}}

.insights{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:18px}
@media (min-width:640px){.insights{grid-template-columns:1fr 1fr}}
.insight{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:4px}
.insight .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.insight .n{font-weight:600;font-size:15.5px}
.insight .d{font-size:13px;color:var(--ink-2)}
.insight.good .k{color:var(--ok)}
.insight.bad .k{color:var(--terra-ink)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(80px,140px) 42px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.srow:first-of-type{border-top:0}
.srow .sname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.streak{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.streak .ic{width:15px;height:15px;color:var(--terra)}
.streak.zero .ic{color:var(--ink-3)}
.srow .sp{text-align:right;font-size:13px;color:var(--ink-2)}
@media (max-width:520px){.srow{grid-template-columns:minmax(0,1fr) auto 42px}.srow .meter{display:none}}

.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow.is-paused .mname{color:var(--ink-3)}
.mmove{display:flex;flex-direction:column}
.mmove .icon-btn{height:22px}
.mname{font-weight:500;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mmeta{font-size:12.5px;color:var(--ink-3)}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daypick .chip{min-width:46px;justify-content:center;height:34px;border-radius:10px}
#p-days .chip{flex-direction:column;gap:0;height:44px;min-width:52px;line-height:1.15}
#p-days .chip .muted{font-size:11px;color:inherit;opacity:.75}

/* ---------- Agenda ---------- */
.inbox{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.inbox-row{display:flex;gap:8px;align-items:center}
.inbox-row .ic{color:var(--ink-3)}
.inbox-row .input{flex:1;min-width:0}
.inbox-list{display:flex;flex-wrap:wrap;gap:8px}
.ibx{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:4px 4px 4px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13.5px;cursor:grab;transition:border-color .15s,box-shadow .15s}
.ibx:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.ibx .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ibx .btn-sm{height:26px;padding:0 8px;font-size:12.5px}
.dragging{opacity:.45}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{position:relative;flex:1 1 220px;min-width:0}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:18px;height:18px}
.search .input{padding-left:36px}
.toolbar .select{width:auto;flex:0 1 190px}
.prod-pill{display:flex;align-items:center;gap:10px;padding:0 12px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2);white-space:nowrap}
.prod-pill .meter{width:64px}
.prod-pill strong{color:var(--ink);font-weight:600}
.late-banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-radius:12px;background:var(--terra-soft);color:var(--terra-ink);font-size:14px}
.late-banner .ic{width:18px;height:18px}
.late-banner .btn{margin-left:auto}

.cal-scroll{overflow:auto;max-height:min(74vh,860px);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overscroll-behavior:contain;box-shadow:var(--shadow-sm)}
.cal{display:grid;grid-template-columns:56px repeat(7,minmax(118px,1fr));min-width:882px;position:relative}
.cal-corner{position:sticky;top:0;left:0;z-index:7;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;padding:0 6px 14px;font-size:10.5px;color:var(--ink-3);line-height:1.2;text-align:right;justify-content:flex-end}
.cal-hcell{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:10px 8px 8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dh-top{display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:8px}
.dname{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:500}
.dnum{font-family:var(--font-display);font-size:20px;display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 4px;border-radius:50%;line-height:1}
.cal-hcell.is-today .dnum{background:var(--teal);color:var(--on-teal)}
.cal-hcell.is-today .dname{color:var(--teal)}
.dprog{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
.dprog .meter{flex:1;height:4px}
.allday{display:flex;flex-direction:column;gap:3px;min-height:26px;padding:3px;margin:0 -3px;border-radius:8px;border:1px dashed transparent;transition:border-color .15s,background .15s}
.allday:empty::before{content:"";display:block;height:18px}
.ad{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 34%,transparent);cursor:pointer;min-width:0}
.ad .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.ad.is-done{opacity:.55}.ad.is-done .t{text-decoration:line-through}
.ad.is-late{border-color:var(--terra)}
.cal-hours{position:sticky;left:0;z-index:5;background:var(--surface);height:calc(var(--hour)*18)}
.cal-hours span{position:absolute;right:8px;font-size:11px;color:var(--ink-3);transform:translateY(-50%)}
.cal-hours span:first-child{transform:translateY(2px)}
.cal-col{position:relative;height:calc(var(--hour)*18);border-left:1px solid var(--line);
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px),linear-gradient(to bottom,color-mix(in srgb,var(--line) 45%,transparent) 1px,transparent 1px);
  background-size:100% var(--hour),100% calc(var(--hour)/2);cursor:copy}
.cal-col.is-today{background-color:color-mix(in srgb,var(--teal) 4%,transparent)}
.drop-hover{background-color:color-mix(in srgb,var(--teal) 9%,transparent)!important;border-color:var(--teal)!important}
.drop-ghost{position:absolute;left:3px;right:3px;border:1.5px dashed var(--teal);border-radius:8px;pointer-events:none;background:color-mix(in srgb,var(--teal) 10%,transparent);font-size:11.5px;color:var(--teal);font-weight:600;padding:3px 7px;z-index:8}
.ev{position:absolute;padding:5px 24px 5px 9px;border-radius:8px;background:color-mix(in srgb,var(--c) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 38%,transparent);box-shadow:inset 3px 0 0 var(--c);color:var(--ink);overflow:hidden;cursor:pointer;font-size:12.5px;line-height:1.25;transition:box-shadow .15s,transform .1s;z-index:2}
.ev:hover{box-shadow:inset 3px 0 0 var(--c),var(--shadow);z-index:4}
.ev:active{transform:scale(.99)}
.ev-title{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ev-time{color:var(--ink-2);font-size:11.5px;display:flex;align-items:center;gap:4px;margin-top:1px}
.ev-time .ic{width:13px;height:13px;color:var(--sand-ink)}
.ev.short{padding-top:2px;padding-bottom:2px}
.ev.short .ev-title{-webkit-line-clamp:1}
.ev.short .ev-time{display:none}
.ev.is-done{opacity:.58}
.ev.is-done .ev-title{text-decoration:line-through}
.ev.is-late{border-color:var(--terra);box-shadow:inset 3px 0 0 var(--terra)}
.ev-check{position:absolute;top:4px;right:4px;width:17px;height:17px;border-radius:5px;border:1.4px solid color-mix(in srgb,var(--c) 70%,var(--ink-3));display:grid;place-items:center;background:var(--surface)}
.ev-check svg{width:11px;height:11px;stroke:var(--on-teal);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ev.is-done .ev-check{background:var(--teal);border-color:var(--teal)}
.ev.is-done .ev-check svg{opacity:1}
.now-line{position:absolute;left:0;right:0;border-top:2px solid var(--terra);z-index:5;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--terra)}
.day-panel .panel-head{margin-bottom:6px}

/* ---------- Planejamento ---------- */
.stepper{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap;font-size:14px;font-weight:500;transition:border-color .15s,color .15s,background .15s}
.step:hover{border-color:var(--line-strong);color:var(--ink)}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:600;font-size:13px}
.step .n .ic{width:15px;height:15px;stroke-width:2.2}
.step[aria-current="step"]{border-color:var(--teal);color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 14%,transparent)}
.step[aria-current="step"] .n{background:var(--teal);color:var(--on-teal)}
.step.done .n{background:var(--teal-soft);color:var(--teal)}
.review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat-tile{display:flex;flex-direction:column;gap:6px}
.stat-tile .big-num{font-size:40px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.goal-row{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center}
.goal-row .gn{font-family:var(--font-display);font-size:26px;color:var(--terra);text-align:center;line-height:1}

.pull-panel{display:flex;flex-direction:column;gap:14px}

/* ---------- Atividade física ---------- */
.subtabs{align-self:flex-start;max-width:100%;overflow-x:auto;flex-wrap:nowrap}

.fday{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-width:0}

.fday-k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}

.fstatus{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}

.fstatus.s-extra{background:var(--teal-soft);color:var(--teal)}
.fstatus.s-partial,.fstatus.s-pending{background:var(--sand-soft);color:var(--sand-ink)}
.fstatus.s-miss{background:var(--terra-soft);color:var(--terra-ink)}
.fstatus.s-rest,.fstatus.s-free{color:var(--ink-3)}
.fchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;text-align:left;line-height:1.3;transition:border-color .15s}
button.fchip:hover{border-color:var(--line-strong)}
.fchip .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fday .fchip,.pfit .fchip{flex-wrap:wrap;width:100%;row-gap:2px}
.fday .fchip .t,.pfit .fchip .t,.fday .fdone .t{white-space:normal;overflow-wrap:anywhere}
.fday .fchip .num,.pfit .fchip .num{flex-basis:100%;padding-left:14px;font-size:11.5px}
.fday .fdone{flex-wrap:wrap;row-gap:0}
.fday .fdone .num{flex-basis:100%;font-size:11.5px}
.fchip.is-rest{color:var(--ink-3);border-style:dashed}
.fdone{display:flex;align-items:center;gap:6px;width:100%;padding:5px 9px;border-radius:8px;background:color-mix(in srgb,var(--c) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);font-size:12.5px;font-weight:500;text-align:left;transition:box-shadow .15s}
.fdone:hover{box-shadow:var(--shadow)}
.fdone .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdone .ic{color:var(--c)}
.linkish.sm{font-size:12.5px}
.fit-today{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:16px 20px}
.ft-left{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 300px}
.ft-items{display:flex;flex-wrap:wrap;gap:6px}
.ft-items .fdone{width:auto}
.srec{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.srec-week{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:14px 0 6px}
.srec-week:first-child{padding-top:0}
.srec:first-child{border-top:0}
.srec-week + .srec{border-top:0}
.srec-type{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.srec-main{min-width:0}
.srec .tmeta span+span::before{content:"·";margin-right:8px;color:var(--line-strong)}
@media (max-width:560px){.srec{grid-template-columns:minmax(0,1fr) auto}.srec-type{grid-column:1/-1}}
.series{position:relative;height:210px;margin:26px 0 0 58px}
.series svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.series .area{fill:color-mix(in srgb,var(--sc) 12%,transparent)}
.series .line{fill:none;stroke:var(--sc);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.series .gridl{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.series .wdot{border-color:var(--sc)} .series .wdot.cur{background:var(--sc)}
.series .waxis{left:-58px;width:52px;text-align:right}
.slabels{display:grid;margin:10px 0 0 58px;font-size:11px;color:var(--ink-3);text-align:center}
.is-entering .series .line{stroke-dasharray:3000;animation:drawLine 1.1s ease-out both}
.prog-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:6px}
@media (min-width:700px){.prog-sum{grid-template-columns:repeat(4,minmax(0,1fr))}}
.prog-sum>div{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.prog-sum strong{font-family:var(--font-display);font-weight:500;font-size:24px;line-height:1.1}
.prog-sum strong.up,.delta-s.up{color:var(--ok)} .prog-sum strong.down,.delta-s.down{color:var(--terra-ink)}
.hist-table{margin-top:18px;border-top:1px solid var(--line)}
.hrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
@media (max-width:560px){.hrow{grid-template-columns:1fr auto}.hrow span:last-child{display:none}}
.rec-row{display:grid;grid-template-columns:minmax(0,1fr) auto 110px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.rec-row:first-of-type{border-top:0}
.rec-row .rname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delta-s{text-align:right;font-size:13px;font-weight:600;color:var(--ink-3)}
.stack{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:clamp(6px,1.4vw,14px);padding-top:24px}
.scol{display:flex;flex-direction:column;gap:8px;min-width:0}
.strack{height:170px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line-strong)}
.sbar{position:relative;width:min(100%,40px);display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:visible}
.sbar i{display:block;min-height:2px}
.sbar i:last-of-type{border-radius:6px 6px 0 0}
.scol:not(.is-cur) .sbar{opacity:.78}
.scol .bval{font-size:11.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.rt-row{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rt-row:first-of-type{border-top:0}
.rt-day{font-weight:500}
.rt-items{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
@media (max-width:520px){.rt-row{grid-template-columns:minmax(0,1fr) auto}.rt-items{grid-column:1/-1;grid-row:2}}
.tpl-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.tpl-row:first-of-type{border-top:0}
.tpl-row>div{min-width:0}
.ex-group{display:flex;flex-direction:column;gap:8px;padding:10px 0}
.ex-list{display:flex;flex-wrap:wrap;gap:6px}
.ex-pill{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:13px;min-height:30px}
.ex-pill .icon-btn.sm{width:24px;height:24px}
.ex-blocks{display:flex;flex-direction:column;gap:12px}
.exb{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.exb-head{display:flex;gap:8px;align-items:center}
.exb-head .select{flex:1;min-width:0}
.exb-last{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.sets{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1.2fr) 32px;gap:6px 8px;align-items:center}
.sets .sh{font-size:11.5px;color:var(--ink-3);font-weight:500}
.sets .sn{font-size:13px;color:var(--ink-2);text-align:center}
.sets .input{height:36px}
.exb .btn-ghost{align-self:flex-start}
.fgrid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check-line{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);cursor:pointer}
.check-line input{width:18px;height:18px;accent-color:var(--teal)}
.tpl-items{display:flex;flex-direction:column;gap:8px;margin:16px 0 10px}
.ti{display:grid;grid-template-columns:minmax(0,2.4fr) 64px 64px minmax(70px,1fr) auto;gap:8px;align-items:center}

.ti-act{display:flex}
@media (max-width:560px){.ti{grid-template-columns:1fr 1fr 1fr auto}.ti>select{grid-column:1/-1}.ti-head{display:none}}
.fit-cols{min-width:980px}
.pfit{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0}
.pfit strong{font-size:13px;font-weight:600}

/* checklist de treino */
.ftile{display:flex;align-items:center;gap:4px}
.ftile .htile{flex:1;min-width:0}
.ftile .htile:disabled{opacity:.62;cursor:default}
.ftile .htile:disabled:hover{box-shadow:none;border-color:var(--line)}
.fcol{flex-direction:column;align-items:flex-start;gap:1px}
.fmeta{font-size:12px;color:var(--ink-3);line-height:1.3}
.fmeta.rec{color:var(--teal);font-weight:500}
.htile.is-done .fmeta.rec{color:var(--teal)}
.flog{flex:none;color:var(--ink-3)}
.fday-title{min-width:0}
.fday-title strong{font-family:var(--font-display);font-weight:500;font-size:18px}
.fday-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.fday .meter{height:4px}
.fday-foot{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:4px;border-top:1px solid var(--line)}
.fday-foot .btn{color:var(--ink-3)}
.fday-extra{display:flex;flex-direction:column;gap:5px}
.fit-today-sec{margin-top:26px}
.de-h{margin:18px 0 8px;font-size:13.5px}
.de-items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;padding:4px 10px;background:var(--bg)}
.de-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}

.de-item .t{flex:1;min-width:0}
.de-other-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px auto;gap:8px;align-items:center}
@media (max-width:560px){.de-other-row{grid-template-columns:1fr 1fr}.de-other-row #de-olabel{grid-column:1/-1}}
.chip .ic-sm{width:14px;height:14px;stroke-width:2.2}
.pfit-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12.5px;width:100%}
.pfit-list li{display:flex;align-items:center;gap:6px;min-width:0}
.pfit-list li span{overflow-wrap:anywhere}
.rt-day{display:flex;flex-direction:column;gap:2px}

/* status de sincronização */
.sync-status{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.sync-status .ic-sm{width:15px;height:15px}
.sync-status[data-state="ok"]{color:var(--ok)}
.sync-status[data-state="syncing"]{color:var(--teal)}
.sync-status[data-state="offline"],.sync-status[data-state="error"]{color:var(--sand-ink)}
.sync-status[data-state="off"]{color:var(--ink-3)}
.side-sync{font-size:12.5px}
.side-ver{font-size:11.5px;color:var(--ink-3)}
.gh-setup{display:flex;flex-direction:column;gap:10px;padding:14px 0 2px;border-top:1px solid var(--line);font-size:14px}
.gh-setup ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);line-height:1.45}
.gh-setup a{color:var(--teal);font-weight:600}
.gh-setup code{font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.sync-chip{align-self:flex-start;font-size:12.5px;padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--line);margin-top:4px}
.side-sync:empty{display:none}

/* seletores de hora e data */
input[data-mask]{cursor:pointer}
.picker{position:fixed;z-index:150;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:12px;animation:toastIn .16s ease-out}
.picker.pk-sheet{left:0;right:0;bottom:0;top:auto;width:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:sheetIn .22s cubic-bezier(.2,.8,.2,1)}
.pk-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.pk-big{font-family:var(--font-display);font-size:34px;line-height:1;letter-spacing:-.02em;padding-left:4px}
.pk-month{font-weight:600}
.pk-labels{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding:0 4px 4px}
.pk-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pk-col{height:216px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:12px;padding:4px;scroll-behavior:auto;background:var(--bg)}

.pk-opt{display:block;width:100%;height:40px;border-radius:9px;font-size:17px;color:var(--ink-2);transition:background .12s,color .12s}
.pk-opt:hover{background:var(--surface-2);color:var(--ink)}
.pk-opt.is-sel{background:var(--teal);color:var(--on-teal);font-weight:600}
.pk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.pk-dow{font-size:11px;color:var(--ink-3);padding:4px 0;text-transform:uppercase}
.pk-day{height:36px;border-radius:9px;font-size:14px;color:var(--ink);transition:background .12s}
.pk-sheet .pk-day{height:44px;font-size:15px}
.pk-day:hover{background:var(--surface-2)}
.pk-day.is-today{box-shadow:inset 0 0 0 1.5px var(--teal);color:var(--teal);font-weight:600}
.pk-day.is-sel{background:var(--teal);color:var(--on-teal);font-weight:600}
.pk-foot{display:flex;align-items:center;gap:4px;margin-top:10px}

/* hábitos em ordem de horário */
.mtime{font-family:var(--font-display);font-size:17px;color:var(--ink-2);min-width:48px}
.log-bar{display:flex;flex-direction:column;gap:12px}
.log-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.log-date{width:132px;height:34px}
.log-period{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.log-period strong{font-family:var(--font-display);font-weight:500;font-size:19px}

/* ---------- Configurações ---------- */
.settings{display:grid;grid-template-columns:1fr;gap:16px;max-width:860px}
.set-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:14px 0;border-top:1px solid var(--line)}

.backup-area{font-family:ui-monospace,Consolas,monospace;font-size:12px;min-height:120px}

/* ---------- Modal e toast ---------- */
.scrim{position:fixed;inset:0;z-index:100;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease-out}
.modal{background:var(--surface);width:100%;max-height:min(92vh,100%);overflow:auto;border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);
  padding-top:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:sheetIn .26s cubic-bezier(.2,.8,.2,1)}

.modal.wide{max-width:720px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:22px;align-items:center}
.spacer{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes sheetIn{from{transform:translateY(24px);opacity:.4}}
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
@media (min-width:960px){#toast-root{bottom:28px;left:calc(50% + var(--side)/2)}}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:var(--shadow-lg);animation:toastIn .22s cubic-bezier(.2,.8,.2,1);transition:opacity .2s,transform .2s}
.toast.out{opacity:0;transform:translateY(6px)}
.toast button{font-weight:600;text-decoration:underline;text-underline-offset:3px}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}}

<script>
/* =========================================================================
   Ritmo Semanal — hábitos, agenda e planejamento semanal
   Tudo em um único arquivo. Os dados ficam no localStorage deste navegador.
   Organização do script:
     1. Utilidades (datas, texto)       4. Cálculos (hábitos, tarefas, planos)
     2. Estado e persistência           5. Componentes e telas  (views)
     3. Dados de exemplo                6. Ações, modais, arrastar-e-soltar, início
   ========================================================================= */
'use strict';

/* ---------- 1. Utilidades de data e texto (sempre no fuso local) ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYmd(s){ const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
function today(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
const todayKey = () => ymd(today());
const addKey = (k, n) => ymd(addDays(parseYmd(k), n));
const isYmd = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && ymd(parseYmd(s)) === s;
const fmtBR = k => { if (!isYmd(k)) return ''; const [y, m, d] = k.split('-'); return `${d}/${m}/${y}`; };
const fmtDM = k => { const [, m, d] = k.split('-'); return `${d}/${m}`; };
function parseBR(txt){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(txt).trim());
  if (!m) return null;
  const k = `${m[3]}-${m[2]}-${m[1]}`;
  return isYmd(k) && +m[3] >= 1900 && +m[3] <= 2200 ? k : null;
}
const DOW_S = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const DOW_L = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const MON_L = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dowOf = k => parseYmd(k).getDay();
function longDate(k, withYear = true){
  const d = parseYmd(k);
  return `${cap(DOW_L[d.getDay()])}, ${d.getDate()} de ${MON_L[d.getMonth()]}${withYear ? ' de ' + d.getFullYear() : ''}`;
}
function weekRangeLabel(startKey){
  const s = parseYmd(startKey), e = addDays(s, 6);
  if (s.getMonth() === e.getMonth()) return `${s.getDate()} a ${e.getDate()} de ${MON_L[e.getMonth()]} de ${e.getFullYear()}`;
  if (s.getFullYear() === e.getFullYear()) return `${s.getDate()} de ${MON_L[s.getMonth()]} a ${e.getDate()} de ${MON_L[e.getMonth()]} de ${e.getFullYear()}`;
  return `${fmtBR(startKey)} a ${fmtBR(ymd(e))}`;
}
const isTime = t => typeof t === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(t);
const toMin = t => isTime(t) ? (+t.slice(0, 2)) * 60 + (+t.slice(3)) : null;
const fromMin = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
function fmtDur(min){ const h = Math.floor(min / 60), m = Math.round(min % 60); if (!h) return `${m} min`; return m ? `${h}h${pad(m)}` : `${h}h`; }
function fmtCount(min){
  if (min < 1) return 'agora';
  if (min < 60) return `${min} min`;
  if (min < 1440) { const h = Math.floor(min / 60), m = min % 60; return m ? `${h}h ${pad(m)}min` : `${h}h`; }
  const d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60);
  return h ? `${d} d ${h}h` : `${d} d`;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pct = (a, b) => b ? Math.round(a / b * 100) : null;
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
function maskDate(v){ const d = v.replace(/\D/g, '').slice(0, 8); if (d.length > 4) return `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4)}`; if (d.length > 2) return `${d.slice(0, 2)}/${d.slice(2)}`; return d; }
function maskTime(v){ const d = v.replace(/\D/g, '').slice(0, 4); return d.length > 2 ? `${d.slice(0, 2)}:${d.slice(2)}` : d; }

/* Início da semana conforme a configuração (0 = domingo, 1 = segunda). */
function weekStartOf(d, ws = state.settings.weekStart){ const diff = (d.getDay() - ws + 7) % 7; return addDays(d, -diff); }
const weekKeyOf = (k, ws) => ymd(weekStartOf(parseYmd(k), ws));
const weekDays = startKey => Array.from({ length: 7 }, (_, i) => addKey(startKey, i));

/* ---------- 2. Estado e persistência ---------- */
const STORE_KEY = 'ritmo-semanal:v1';
const DEFAULT_CATS = [
  { id: 'trabalho', name: 'Trabalho', color: '#1F6F6B' },
  { id: 'reuniao', name: 'Reunião', color: '#D9694A' },

/* Estilos visuais: mudam cores, fontes e formas; nunca as funções. [claro, escuro]: fundo, principal, destaque, apoio, texto */
const STYLES = [
  { id: 'petroleo', name: 'Petróleo', desc: 'Calmo e sóbrio, com títulos serifados', font: "'Fraunces',Georgia,serif", light: ['#F6F3EE', '#1F6F6B', '#D9694A', '#D2AA5A', '#1F2326'], dark: ['#14181A', '#4C928C', '#CB7A61', '#C4A66C', '#E8E5DF'], fonts: '' },
  { id: 'rubronegro', name: 'Rubro-negro', desc: 'Vermelho e preto, letras condensadas', font: "'Oswald',sans-serif", light: ['#F4F2F1', '#C8102E', '#1E1E1E', '#C98204', '#121212'], dark: ['#0B0B0B', '#E5323F', '#F2F0EF', '#E9A23B', '#F2F0EF'], fonts: 'family=Oswald:wght@500;600&family=Barlow:wght@400;500;600' },
  { id: 'oceano', name: 'Oceano', desc: 'Azul-marinho, limpo e arredondado', font: "'Manrope',sans-serif", light: ['#F2F6FA', '#1B4F8C', '#3BA3C9', '#E07A3F', '#12233A'], dark: ['#0C1522', '#5B9BE0', '#5CC3E6', '#E99566', '#E6EEF7'], fonts: 'family=Manrope:wght@400;500;600;700;800' },
  { id: 'mata', name: 'Mata', desc: 'Verde-floresta e dourado, letras com serifa', font: "'Bitter',Georgia,serif", light: ['#F3F4EE', '#2F6B45', '#7E8F3A', '#B8862B', '#1C2A1F'], dark: ['#101611', '#5FA67A', '#A3B356', '#D4A64B', '#E8EEE5'], fonts: 'family=Bitter:wght@500;600;700&family=Source+Sans+3:wght@400;500;600' },
  { id: 'moderno', name: 'Moderno', desc: 'Preto, branco e laranja, cantos retos', font: "'Sora',sans-serif", light: ['#F7F7F7', '#0A0A0A', '#FF5A1F', '#7A7A7A', '#0A0A0A'], dark: ['#0A0A0A', '#F5F5F5', '#FF6A33', '#9A9A9A', '#F5F5F5'], fonts: 'family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500' },
  { id: 'rustico', name: 'Rústico', desc: 'Couro e papel, com textura suave', font: "'Alegreya',Georgia,serif", light: ['#EFE6D3', '#6B4226', '#B5542D', '#A9803A', '#3A2A1C'], dark: ['#1B1510', '#C99A6B', '#D77C52', '#CFAA5E', '#EFE4D1'], fonts: 'family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700' },
  { id: 'solar', name: 'Solar', desc: 'Amarelo leve e formas bem redondas', font: "'Quicksand',sans-serif", light: ['#FFFBEF', '#E8B100', '#F0785A', '#8BBF6A', '#2B2615'], dark: ['#17140B', '#F2BC2E', '#F28F72', '#9FCF7F', '#F6EED8'], fonts: 'family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700' },
  { id: 'lavanda', name: 'Lavanda', desc: 'Roxo e rosa, moderno e leve', font: "'Outfit',sans-serif", light: ['#F8F5FC', '#7B4FD1', '#E2559C', '#F2A271', '#231A33'], dark: ['#120E1A', '#A585F0', '#F07AB6', '#F5B58E', '#EFE9F8'], fonts: 'family=Outfit:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600' },
];
const PRI = { alta: { label: 'Alta', n: 3 }, media: { label: 'Média', n: 2 }, baixa: { label: 'Baixa', n: 1 } };
const STATUS = { todo: 'A fazer', doing: 'Em andamento', done: 'Concluída', canceled: 'Cancelada' };

function blankState(){
  return {
    version: 1,
    settings: { theme: 'auto', style: 'petroleo', weekStart: 1, name: 'Thiago' },
    categories: DEFAULT_CATS.map(c => ({ ...c })),
    habits: [], habitLog: {}, tasks: [], plans: {}, fit: blankFit(),
    moves: { habits: {}, fit: {} },  // hábitos e itens de treino adiados/cancelados por dia
    late: { habits: {}, fit: {} },   // marcados depois do dia planejado: {dia: {id: dia em que foi feito}}
    meta: { seeded: false },
  };
}

/* Garante um formato válido mesmo com dados antigos, incompletos ou importados. */
function normalize(raw){
  const b = blankState();
  if (!raw || typeof raw !== 'object') return b;
  const s = { ...b };
  s.settings = { ...b.settings, ...(raw.settings || {}) };
  if (![0, 1].includes(s.settings.weekStart)) s.settings.weekStart = 1;
  if (!['auto', 'light', 'dark'].includes(s.settings.theme)) s.settings.theme = 'auto';
  if (!STYLES.some(x => x.id === s.settings.style)) s.settings.style = 'petroleo';
  if (typeof s.settings.name !== 'string') s.settings.name = '';
  s.categories = Array.isArray(raw.categories) && raw.categories.length
    ? raw.categories.filter(c => c && c.id && c.name).map(c => ({ id: String(c.id), name: String(c.name), color: /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : '#8A8278' }))
    : b.categories;
  if (!s.categories.some(c => c.id === 'outros')) s.categories.push({ id: 'outros', name: 'Outros', color: '#8A8278' });
  s.habits = Array.isArray(raw.habits) ? raw.habits.filter(h => h && h.id && h.name).map((h, i) => ({
    icon: '', time: '', paused: false, pausedAt: null, createdAt: '2000-01-01', ...h,
    days: Array.isArray(h.days) ? h.days.filter(d => d >= 0 && d <= 6) : [0, 1, 2, 3, 4, 5, 6],
    order: Number.isFinite(h.order) ? h.order : i,
  })) : [];
  s.habitLog = {};
  if (raw.habitLog && typeof raw.habitLog === 'object') for (const k in raw.habitLog) if (isYmd(k) && Array.isArray(raw.habitLog[k])) s.habitLog[k] = raw.habitLog[k].slice();

    start: '', end: '', category: 'outros', priority: 'media', notes: '', status: 'todo', ...t,
    date: isYmd(t.date) ? t.date : null,
    hist: Array.isArray(t.hist) ? t.hist.filter(e => e && e.k) : [],
  })) : [];
  for (const t of s.tasks) {
    if (!PRI[t.priority]) t.priority = 'media';
    if (!STATUS[t.status]) t.status = 'todo';
    if (!isTime(t.start)) t.start = '';
    if (!isTime(t.end)) t.end = '';
  }
  s.plans = {};
  if (raw.plans && typeof raw.plans === 'object') for (const k in raw.plans) {
    const p = raw.plans[k]; if (!isYmd(k) || !p) continue;

    while (goals.length < 3) goals.push('');
    s.plans[k] = { review: String(p.review || ''), goals, items: Array.isArray(p.items) ? p.items.filter(i => i && i.id && i.title && isYmd(i.date)) : [], appliedAt: p.appliedAt || null, updatedAt: p.updatedAt || null, example: !!p.example };
  }

    for (const d in src) {

      const o = {}; for (const id in src[d]) { const m = src[d][id]; if (m && typeof m === 'object' && (m.c || isYmd(m.to))) o[id] = { ...m }; }
      if (Object.keys(o).length) s.moves[g][d] = o;
    }
  }
  s.late = { habits: {}, fit: {} };
  if (raw.late && typeof raw.late === 'object') for (const g of ['habits', 'fit']) {
    const src = raw.late[g]; if (!src || typeof src !== 'object') continue;
    for (const d in src) {
      if (!isYmd(d) || !src[d] || typeof src[d] !== 'object') continue;
      const o = {}; for (const id in src[d]) if (isYmd(src[d][id])) o[id] = src[d][id];
      if (Object.keys(o).length) s.late[g][d] = o;
    }
  }

  return s;
}

  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return normalize(JSON.parse(raw)); }

}
let booting = true; // durante a abertura, ajustes internos não contam como alteração do usuário

const catById = id => state.categories.find(c => c.id === id) || state.categories.find(c => c.id === 'outros') || DEFAULT_CATS[5];

/* ---------- 3. Dados de exemplo (relativos à data de hoje) ---------- */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function seed(s){

  const all = [0, 1, 2, 3, 4, 5, 6], wk = [1, 2, 3, 4, 5];
  const defs = [
    ['Acordar cedo', '05:30', all, .82],
    ['Fazer o café da minha esposa', '06:00', all, .9],
    ['Ir à academia', '06:30', wk, .62],
    ['Tomar banho', '07:30', all, .97],
    ['Tomar café da manhã', '07:45', all, .86],

/* ---------- 4. Cálculos ---------- */
/* Hábitos seguem a ordem do horário do dia (sem horário vão para o fim). */
const sortedHabits = () => [...state.habits].sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99') || a.name.localeCompare(b.name));
function habitApplies(h, k){
  if (k < h.createdAt) return false;
  if (h.paused && (!h.pausedAt || k >= h.pausedAt)) return false;
  return h.days.includes(dowOf(k));
}
const habitsFor = k => sortedHabits().filter(h => habitOn(h, k));
const isDone = (hid, k) => (state.habitLog[k] || []).includes(hid);
function habitDay(k){ const hs = habitsFor(k); return { planned: hs.length, done: hs.filter(h => isDone(h.id, k)).length }; }
/* Média ponderada: soma de feitos ÷ soma de previstos, só até hoje. */
function habitRange(startKey, days, upto = todayKey()){
  let p = 0, d = 0;
  for (let i = 0; i < days; i++) { const k = addKey(startKey, i); if (k > upto) break; const r = habitDay(k); p += r.planned; d += r.done; }
  return { planned: p, done: d, pct: pct(d, p) };
}
function streak(h){
  let k = todayKey();
  if (habitOn(h, k) && !isDone(h.id, k)) k = addKey(k, -1);
  let n = 0;
  for (let i = 0; i < 500 && k >= h.createdAt; i++, k = addKey(k, -1)) {
    if (!habitOn(h, k)) continue;
    if (isDone(h.id, k)) n++; else break;
  }
  return n;
}
function habitStats(){
  const tk = todayKey();
  return sortedHabits().filter(h => !h.paused).map(h => {
    let p = 0, d = 0;
    for (let i = 0; i < 30; i++) {
      const k = addKey(tk, -i);
      if (!habitOn(h, k)) continue;
      if (i === 0 && !isDone(h.id, k)) continue; // hoje ainda está em aberto
      p++; if (isDone(h.id, k)) d++;
    }
    return { h, planned: p, done: d, rate: pct(d, p), streak: streak(h) };
  });
}

function taskSpan(t){
  const s = toMin(t.start); if (s == null) return null;
  let e = toMin(t.end); if (e == null || e <= s) e = Math.min(s + 60, 1440);
  return [s, e];
}
const isCanceled = t => t.status === 'canceled';
const tasksOn = k => state.tasks.filter(t => t.date === k && !isCanceled(t));
function sortTasks(arr){ return arr.sort((a, b) => (a.date || '').localeCompare(b.date || '') || ((toMin(a.start) ?? -1) - (toMin(b.start) ?? -1)) || a.title.localeCompare(b.title)); }
function taskDay(k){ const ts = tasksOn(k); return { planned: ts.length, done: ts.filter(t => t.status === 'done').length }; }
function taskRange(startKey, days, upto = todayKey()){
  let p = 0, d = 0;
  for (let i = 0; i < days; i++) { const k = addKey(startKey, i); if (k > upto) break; const r = taskDay(k); p += r.planned; d += r.done; }
  return { planned: p, done: d, pct: pct(d, p) };
}
function isOverdue(t){
  if (t.status === 'done' || isCanceled(t) || !t.date) return false;
  const tk = todayKey();
  if (t.date < tk) return true;
  if (t.date === tk) { const sp = taskSpan(t); return !!sp && sp[1] <= nowMin(); }
  return false;
}
const overlap = (a, b) => a[0] < b[1] && b[0] < a[1];
function conflictsOf(t, pool = state.tasks){
  const sp = taskSpan(t); if (!sp || !t.date) return [];
  return pool.filter(o => o.id !== t.id && o.date === t.date && o.status !== 'done' && !isCanceled(o) && taskSpan(o) && overlap(sp, taskSpan(o)));
}

/* Planejamento semanal */
function getPlan(key){
  if (!state.plans[key]) state.plans[key] = { review: '', goals: ['', '', ''], items: [], appliedAt: null, updatedAt: null };
  return state.plans[key];
}
const peekPlan = key => state.plans[key] || { review: '', goals: ['', '', ''], items: [], appliedAt: null };
function itemMinutes(i){ const s = toMin(i.start), e = toMin(i.end); return s != null && e != null && e > s ? e - s : 0; }
function planLoad(key, plan){
  return weekDays(key).map(k => {
    const items = plan.items.filter(i => i.date === k);
    return { k, items, min: items.reduce((a, i) => a + itemMinutes(i), 0) };
  });
}
function touchPlan(plan){ plan.updatedAt = new Date().toISOString(); }

const icon = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
const CHECK_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5"/></svg>';

/* Anel de progresso: anima a partir do último valor exibido. */
const ringMemo = {};
function ring(id, value, { size = 180, stroke = 12, color = 'var(--teal)', label = '', sub = '' } = {}){
  const r = (size - stroke) / 2, C = 2 * Math.PI * r;
  const v = value == null ? 0 : clamp(value, 0, 100);
  const from = ringMemo[id] ?? 0;
  ringMemo[id] = v;
  const off0 = (C * (1 - from / 100)).toFixed(2), off1 = (C * (1 - v / 100)).toFixed(2);
  const c = size / 2;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)}: ${value == null ? 'sem itens previstos' : v + '%'}">
      <circle class="track" cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${stroke}"/>
      <circle class="prog ${v === 0 ? 'zero' : ''}" cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${C.toFixed(2)}" style="stroke:${color};stroke-dashoffset:${off0}px" data-to="${off1}"/>
    </svg>
    <div class="ring-center"><div class="ring-value" style="font-size:${Math.round(size * .25)}px">${value == null ? '—' : v + '<small>%</small>'}</div>${sub ? `<div class="ring-sub">${sub}</div>` : ''}</div>
  </div>`;
}
function settleRings(){
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$('.ring .prog[data-to]').forEach(el => { el.style.strokeDashoffset = el.dataset.to + 'px'; el.removeAttribute('data-to'); });
  }));
}
const meter = (p, cls = '') => `<div class="meter ${cls}"><b style="width:${p == null ? 0 : clamp(p, 0, 100)}%"></b></div>`;
function priGlyph(p){
  const n = PRI[p]?.n || 2;
  return `<span class="pri pri-${p}" title="Prioridade ${PRI[p]?.label || 'Média'}"><svg viewBox="0 0 14 14" aria-hidden="true">${[0, 1, 2].map(i => `<rect x="${i * 4.6 + .6}" y="${9 - i * 3.2}" width="3.4" height="${4.4 + i * 3.2}" rx="1" class="${i < n ? 'on' : ''}"/>`).join('')}</svg><span class="sr-only">Prioridade ${PRI[p]?.label}</span></span>`;
}
function daysLabel(days){
  const d = [...days].sort();
  if (d.length === 7) return 'Todos os dias';

}
const orderedDows = () => Array.from({ length: 7 }, (_, i) => (i + state.settings.weekStart) % 7);
function timeLabel(t){ return isTime(t.start) ? `${t.start}${isTime(t.end) ? '–' + t.end : ''}` : 'Dia todo'; }
function dayShort(k){ const tk = todayKey(); if (k === tk) return 'Hoje'; if (k === addKey(tk, 1)) return 'Amanhã'; if (k === addKey(tk, -1)) return 'Ontem'; return `${DOW_S[dowOf(k)]}, ${fmtBR(k)}`; }

function habitTile(h, k, compact = false){

/* ---------- Tela: Hoje ---------- */
function nextAppt(){
  const tk = todayKey(), nm = nowMin(); let best = null;
  for (const t of state.tasks) {
    if (t.status === 'done' || !t.date || !isTime(t.start)) continue;
    const dd = Math.round((parseYmd(t.date) - parseYmd(tk)) / 864e5);
    if (dd < 0 || dd > 14) continue;
    const sp = taskSpan(t), sA = dd * 1440 + sp[0], eA = dd * 1440 + sp[1];
    if (eA <= nm) continue;
    if (!best || sA < best.sA) best = { t, sA, eA };
  }
  return best;
}
function nextCard(){
  const b = nextAppt();
  if (!b) return `<div class="eyebrow">Próximo compromisso</div><p class="empty">Nenhum compromisso com horário nos próximos dias.</p>`;
  const nm = nowMin(), inProg = b.sA <= nm, c = catById(b.t.category);
  return `<div class="eyebrow">Próximo compromisso</div>
    <div class="next-count num">${inProg ? fmtCount(b.eA - nm) : fmtCount(b.sA - nm)}</div>
    <div class="next-cap">${inProg ? 'para terminar · em andamento' : 'para começar'}</div>
    <div class="next-title">${esc(b.t.title)}</div>
    <div class="next-meta"><span class="num">${dayShort(b.t.date)} · ${timeLabel(b.t)}</span><span class="cat"><i class="cat-dot" style="--c:${c.color}"></i>${esc(c.name)}</span></div>`;
}

function weeksChart(){
  const cur = weekKeyOf(todayKey()), pts = [];
  for (let i = 7; i >= 0; i--) { const s = addKey(cur, -7 * i); pts.push({ k: s, p: habitRange(s, 7).pct, cur: i === 0 }); }
  const yOf = p => 100 - p;   // 0–100 no eixo vertical (em %)
  const xOf = i => (i + .5) / 8 * 100;
  const valid = pts.map((p, i) => ({ ...p, i })).filter(p => p.p != null);
  const avg = valid.length ? Math.round(valid.reduce((a, p) => a + p.p, 0) / valid.length) : null;
  const line = valid.map((p, j) => `${j ? 'L' : 'M'}${xOf(p.i).toFixed(2)} ${yOf(p.p)}`).join(' ');
  const area = valid.length > 1 ? `${line} L${xOf(valid[valid.length - 1].i).toFixed(2)} 100 L${xOf(valid[0].i).toFixed(2)} 100 Z` : '';

        ${area ? `<path class="area" d="${area}"/>` : ''}
        ${avg != null ? `<line class="avg" x1="0" x2="100" y1="${yOf(avg)}" y2="${yOf(avg)}"/>` : ''}
        ${line ? `<path class="line" d="${line}"/>` : ''}
      </svg>
      ${[0, 50, 100].map(v => `<span class="waxis" style="top:${yOf(v)}%">${v}%</span>`).join('')}

      ${valid.map(p => `<span class="wdot ${p.cur ? 'cur' : ''}" style="left:${xOf(p.i)}%;top:${yOf(p.p)}%"></span><span class="wval num" style="left:${xOf(p.i)}%;top:${yOf(p.p)}%">${p.p}%</span>`).join('')}
    </div>
    <div class="wlabels num">${pts.map(p => `<span class="${p.cur ? 'cur' : ''}">${p.cur ? 'Atual' : fmtDM(p.k)}</span>`).join('')}</div>`;
}

/* ---------- Tela: Agenda ---------- */
const HOUR_PX = 52, DAY_START = 6 * 60, DAY_END = 24 * 60;
function passFilter(t){
  if (isCanceled(t)) return false;
  const f = ui.filters;
  if (f.cat && t.category !== f.cat) return false;
  if (f.pri && t.priority !== f.pri) return false;
  if (f.q && !norm(t.title + ' ' + t.notes).includes(norm(f.q))) return false;
  return true;
}
function layoutLanes(items){
  const ev = items.map(t => ({ t, sp: taskSpan(t) })).sort((a, b) => a.sp[0] - b.sp[0] || b.sp[1] - a.sp[1]);
  let cluster = [], lanes = [], clusterEnd = -1;
  const flush = () => { const n = lanes.length; cluster.forEach(e => e.lanes = n); cluster = []; lanes = []; };
  for (const e of ev) {
    if (e.sp[0] >= clusterEnd && cluster.length) flush();
    let li = lanes.findIndex(end => end <= e.sp[0]);
    if (li < 0) { li = lanes.length; lanes.push(0); }
    lanes[li] = e.sp[1]; e.lane = li; cluster.push(e);
    clusterEnd = Math.max(clusterEnd, e.sp[1]);
  }
  flush();
  return ev;
}
function weekGrid(){
  const days = weekDays(ui.agendaWeek), tk = todayKey(), H = HOUR_PX;
  const heads = days.map(k => {
    const r = taskDay(k), p = pct(r.done, r.planned);
    const allday = state.tasks.filter(t => t.date === k && !isTime(t.start) && passFilter(t));
    return `<div class="cal-hcell ${k === tk ? 'is-today' : ''}">
      <div class="dh-top" data-act="agenda-open-day" data-date="${k}" role="button" tabindex="0" title="Ver o dia"><span class="dname">${DOW_S[dowOf(k)]}</span><span class="dnum num">${parseYmd(k).getDate()}</span></div>
      <div class="dprog num" title="Tarefas concluídas ÷ previstas">${r.planned ? `${r.done}/${r.planned}` : '—'}${meter(p)}</div>
      <div class="allday" data-drop="allday" data-date="${k}">${allday.map(t => {
        const c = catById(t.category);
        return `<div class="ad ${t.status === 'done' ? 'is-done' : ''} ${isOverdue(t) ? 'is-late' : ''}" style="--c:${c.color}" draggable="true" data-drag="task" data-id="${t.id}" data-act="task-edit" title="${esc(t.title)}"><i class="cat-dot"></i><span class="t">${esc(t.title)}</span></div>`;
      }).join('')}</div>
    </div>`;
  }).join('');
  const hours = Array.from({ length: 18 }, (_, i) => `<span class="num" style="top:${i * H}px">${pad(i + 6)}:00</span>`).join('');
  const cols = days.map(k => {
    const items = state.tasks.filter(t => t.date === k && isTime(t.start) && passFilter(t));
    const blocks = layoutLanes(items).map(({ t, sp, lane, lanes }) => {
      const s = clamp(sp[0], DAY_START, DAY_END - 15), e = clamp(sp[1], s + 15, DAY_END);
      const top = (s - DAY_START) / 60 * H, hgt = Math.max((e - s) / 60 * H - 2, 22);
      const c = catById(t.category), done = t.status === 'done', late = isOverdue(t), conf = !done && conflictsOf(t).length > 0;
      return `<div class="ev ${hgt < 40 ? 'short' : ''} ${done ? 'is-done' : ''} ${late ? 'is-late' : ''}" style="--c:${c.color};top:${top}px;height:${hgt}px;left:calc(${lane / lanes * 100}% + 2px);width:calc(${100 / lanes}% - 4px)"
        draggable="true" data-drag="task" data-id="${t.id}" data-act="task-edit" title="${esc(t.title)} · ${timeLabel(t)}${conf ? ' · conflito de horário' : ''}${late ? ' · atrasada' : ''}">
        <button class="ev-check" data-act="toggle-task" data-id="${t.id}" aria-label="${done ? 'Desmarcar' : 'Concluir'} ${esc(t.title)}"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-6.5"/></svg></button>
        <div class="ev-title">${esc(t.title)}</div>
        <div class="ev-time num">${conf ? icon('alert') : ''}${timeLabel(t)}</div>
      </div>`;
    }).join('');
    const nm = nowMin();
    const now = k === tk && nm >= DAY_START ? `<div class="now-line" style="top:${(nm - DAY_START) / 60 * H}px"></div>` : '';
    return `<div class="cal-col ${k === tk ? 'is-today' : ''}" data-drop="slot" data-date="${k}" data-act="slot">${blocks}${now}</div>`;
  }).join('');
  return `<div class="cal-scroll" id="cal-scroll"><div class="cal" style="--hour:${H}px">
    <div class="cal-corner">O dia<br>todo</div>${heads}
    <div class="cal-hours">${hours}</div>${cols}
  </div></div>`;
}
function dayList(){

/* ---------- Tela: Planejamento semanal ---------- */
function weekRel(key){
  const n = Math.round((parseYmd(key) - parseYmd(weekKeyOf(todayKey()))) / (7 * 864e5));
  return n === 0 ? 'Esta semana' : n === 1 ? 'Próxima semana' : n === -1 ? 'Semana passada' : n > 1 ? `Daqui a ${n} semanas` : `Há ${-n} semanas`;
}
function pendingFrom(prevKey, plan){
  const end = addKey(prevKey, 6), tk = todayKey();
  const inPlan = new Set(plan.items.map(i => i.taskId).filter(Boolean));
  const list = state.tasks.filter(t => t.date && t.date >= prevKey && t.date <= end && !isCanceled(t));
  return {
    all: list,

/* Fontes do Google Fonts de cada estilo, carregadas só quando usadas. */

}
const isDarkNow = () => { const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); };
function applyTheme(){

function render(){

  else view.classList.remove('is-entering');

function afterAgenda(keep){
  const sc = $('#cal-scroll'); if (!sc) return;
  if (keep) { sc.scrollTop = keep.t; sc.scrollLeft = keep.l; return; }
  const days = weekDays(ui.agendaWeek), i = days.indexOf(todayKey());
  const focusMin = i >= 0 ? clamp(nowMin() - 90, DAY_START, 20 * 60) : 7 * 60;
  sc.scrollTop = (focusMin - DAY_START) / 60 * HOUR_PX;

}

/* Toast com opção de desfazer */
function toast(msg, { undo } = {}){
  const root = $('#toast-root'); const el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Desfazer</button>' : ''}`;
  if (undo) el.querySelector('button').addEventListener('click', () => { undo(); el.remove(); });
  root.appendChild(el);
  while (root.children.length > 3) root.firstChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, undo ? 5500 : 2800);
}
